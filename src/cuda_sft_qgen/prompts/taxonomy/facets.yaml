# v2: corrected the three factually wrong example claims of v1 (formula units, per-arch CTA limits, sector wording),
# and added facets for scenario, toolchain, numerics and system breadth. Example claims were checked by hand;
# keep every example claim true for ALL architectures it names — examples are copied in style by the curator.
facets:
  - id: formula
    when: |
      The L2 is thin on closed-form identities (occupancy, offset, bank map, sectors, alignment, stage bytes, bandwidth).
    must: |
      Prefer kind=formula. Every claim contains `=`/`→`/`=>`, names inputs with units and a unique output.
      Arch-dependent constants must name the architecture (sm_80 …) instead of a range of architectures.
    must_not: |
      No glossary identities, no "derive a performance model", no ranges like "SM70–SM90" when limits differ inside the range.
    example_claim: |
      On sm_80, resident warps limited by registers = floor(65536 / (ceil(regs_per_thread*32/256)*256)); 36 regs/thread → 51 warps.
    banned_claim: |
      Occupancy is determined by registers, shared memory, and the warp limit.

  - id: numeric
    when: |
      The L2 needs plug-in instances with a unique numeric result.
    must: |
      Prefer kind=numeric. Include concrete numbers, units and the architecture whose limits apply; the result must differ
      from what the most common naive calculation gives when possible.
    must_not: |
      No "estimate performance" without a unique value; no unit-less numbers; no duplicate of a formula leaf by changing one constant.
    example_claim: |
      On sm_80 a 1024-thread block is capped at 2 resident CTAs by the 2048 threads/SM limit; on sm_86 (1536 threads/SM) only 1 fits.
    banned_claim: |
      Occupancy depends on how many threads you launch per block.

  - id: failure
    when: |
      The L2 lacks observable wrong outcomes: race, silent corruption, UB, hang, premature wait completion.
    must: |
      Prefer kind=failure. Name a concrete path (code, mask, launch, barrier, OOB) AND the observable. UB is stated as UB.
    must_not: |
      No "might be racy"; no "deterministically deadlocks" for UB; no arch-availability claims (that is feature).
    example_claim: |
      If mbarrier.arrive.expect_tx declares fewer bytes than the TMA loads deliver, the phase can complete before all bytes land and consumers may read a partial tile.
    banned_claim: |
      Forgetting synchronization can cause race conditions in CUDA kernels.

  - id: feature
    when: |
      The L2 needs architecture/version gates or hard limits not true on every GPU.
    must: |
      Prefer kind=feature. Name sm_ / Hopper / Blackwell / Ampere / CUDA version AND one violable hard constraint;
      distinguish sm_90 vs sm_90a, sm_100a vs sm_120.
    must_not: |
      No press-release tone; no feature without a constraint; never equate GeForce Blackwell (sm_120) with sm_100a.
    example_claim: |
      wgmma.mma_async requires compiling for sm_90a; code built for compute_90a cannot be JIT-compiled to run on sm_100.
    banned_claim: |
      Hopper TMA greatly improves asynchronous copy performance.

  - id: mechanism
    when: |
      The L2 needs causal hardware/execution reasons.
    must: |
      Prefer kind=mechanism. Form "A causes B because <unit-level reason>", naming the unit (warp, SMSP, CTA, cluster, L1TEX, L2 sector, TMEM).
    must_not: |
      No glossary, tautology, or formula disguised as mechanism.
    example_claim: |
      Since sm_70 lanes of a warp are not guaranteed to execute in lockstep, so a warp-synchronous smem reduction without __syncwarp between read and write steps can read stale values.
    banned_claim: |
      A streaming multiprocessor contains schedulers and registers that execute warps.

  - id: api
    when: |
      The L2 needs legal vs illegal invocations, parameters or return codes.
    must: |
      Prefer kind=api. State a legality/parameter/return constraint showable with 2–4 snippets; name the exact token.
    must_not: |
      No tutorials; no invented APIs; no numeric identity as api.
    example_claim: |
      cp.async.cg supports only cp-size 16 bytes while cp.async.ca supports 4, 8 and 16; any other size is illegal PTX.
    banned_claim: |
      CUDA provides cp.async to copy data asynchronously.

  - id: layout
    when: |
      The L2 is CuTe/CUTLASS layout, swizzle, TMA box, bank mapping or coordinate→offset algebra.
    must: |
      Mention Shape/Stride, composition, complement, logical_divide/product, swizzle, bank, or TMA box with a worked coordinate.
    must_not: |
      No "layout is important for performance"; no layout claim without Shape/Stride or a bank map.
    example_claim: |
      CuTe maps a 1-D index colexicographically, so (4,8):(8,1) evaluated at index 13 uses coordinate (1,3) and returns 11.
    banned_claim: |
      CuTe layouts describe how tensors are stored in memory.

  - id: profiling
    when: |
      The L2 needs Nsight Compute/Systems observables.
    must: |
      Name a real metric or section (e.g. l1tex__t_sectors_pipe_lsu_mem_global_op_ld.sum, l1tex__data_bank_conflicts_pipe_lsu_mem_shared_op_ld.sum,
      dram__bytes.sum, smsp__warp_issue_stalled_long_scoreboard) and the direction/magnitude of change.
    must_not: |
      No "use Nsight to find bottlenecks"; no invented counters; no "occupancy up ⇒ faster" without a limiter qualifier.
    example_claim: |
      For a warp load of a[lane+1] from a 128B-aligned float array, sectors/request rises from 4 to 5 because the 128 bytes span five 32B sectors.
    banned_claim: |
      Use Nsight Compute to find bottlenecks in the kernel.

  - id: arch_migrate
    when: |
      The L2 needs Ampere ↔ Hopper ↔ Blackwell semantic diffs.
    must: |
      Name both sides or a one-way gate plus a hard constraint.
    must_not: |
      No "on Hopper it just runs faster"; no invented migrations.
    example_claim: |
      Ampere cp.async completion is tracked per thread with commit/wait_group, whereas Hopper TMA completion is tracked by an mbarrier transaction count shared by the CTA.
    banned_claim: |
      On Hopper the same kernel just runs faster.

  - id: cross_factor
    when: |
      Leaves are single-factor and writers need two interacting constraints.
    must: |
      Name ≥2 factors and which one decides the outcome; one sentence; falsifiable.
    must_not: |
      No best-practice lists; no unrelated fusions.
    example_claim: |
      A 3-stage cp.async pipeline needs both wait_group 2 (own copies) and __syncthreads (other threads' copies) before consuming a tile.
    banned_claim: |
      Kernel performance depends on many factors.

  - id: derivation
    when: |
      The L2 needs a 2–4 step closed-form chain.
    must: |
      Emit 2–4 formula leaves with shared units where later leaves instantiate earlier ones.
    must_not: |
      No single isolated formula; no open essays.
    example_claim: |
      A warp reading 4-byte words at stride 2 from an aligned base spans 256 bytes = 8 sectors, versus 4 sectors for unit stride.
    banned_claim: |
      Derive a roofline model for the kernel.

  # ---------- new in v2 ----------
  - id: scenario
    when: |
      The L2's leaves are all "generic" and writers keep producing toy kernels.
    must: |
      Anchor each claim in a named workload (GEMM mainloop, attention softmax, KV-cache paging, reduction, scan, histogram,
      transpose, stencil, SpMV, MoE all-to-all, data loader) while keeping one falsifiable constraint.
    must_not: |
      No workload name without a constraint; no application-level advice.
    example_claim: |
      In an online-softmax attention kernel, rescaling the running sum by exp(m_old - m_new) when the row max increases keeps the result exact; omitting it overweights earlier tiles.
    banned_claim: |
      Attention kernels benefit from tiling.

  - id: toolchain
    when: |
      The L2 concerns nvcc/ptxas/fatbin/JIT/driver compatibility or build flags.
    must: |
      Name the flag or artifact (-gencode, sm_XXa, -rdc, -lineinfo, -Xptxas -v, cuobjdump) and its observable effect.
    must_not: |
      No generic "compile with optimization".
    example_claim: |
      A fatbin with only sm_80 SASS fails on sm_90 with "no kernel image is available"; adding compute_80 PTX lets the driver JIT it.
    banned_claim: |
      nvcc compiles CUDA code for GPUs.

  - id: numerics
    when: |
      The L2 concerns precision, rounding, FMA contraction, low-precision formats or determinism.
    must: |
      Name the format/flag (bf16, tf32, E4M3, E5M2, NVFP4, MXFP4, --fmad, -use_fast_math, atomicAdd order) and a checkable consequence.
    must_not: |
      No "lower precision is faster" without a numeric constraint.
    example_claim: |
      FP8 E4M3 has max finite value 448 while E5M2 reaches 57344, so a per-tensor scale for E4M3 must map amax to <= 448.
    banned_claim: |
      FP8 makes training faster.

  - id: system
    when: |
      The L2 concerns multi-GPU, communication, MPS/MIG, streams across processes.
    must: |
      Name the component (NCCL collective, NVLink/P2P, NVSHMEM, MIG slice, MPS) and a quantitative or legality constraint.
    must_not: |
      No cluster-architecture essays.
    example_claim: |
      nccl-tests report busbw = algbw * 2(n-1)/n for all_reduce, so 8 GPUs at 100 GB/s algbw correspond to 175 GB/s busbw.
    banned_claim: |
      NCCL enables fast multi-GPU communication.
