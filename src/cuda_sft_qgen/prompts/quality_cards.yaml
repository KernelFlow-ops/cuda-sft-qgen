bloom:
  remember: |
    一个可核对的硬事实（API 签名/合法取值、对齐字节、指令名、架构门槛）。必须以"判断合法性/选出正确项/填写取值"的形式出题，禁止名词解释。
  understand: |
    机制因果：给出现象，要求说明"为什么必然如此"的硬件/执行模型理由；答案需能被逐条核对（rubric 2–4 点）。
  apply: |
    给定具体参数或代码，按规则算出或写出唯一结果；题干含全部输入，结果可由第三方独立复算。
  analyze: |
    场景中至少 2 个因素交互（同步×可见性、占用×延迟、TMA×对齐、精度×缩放），要求指出决定结果的因素并给出依据。
  evaluate: |
    两个或以上可行方案/结论 + 题干给出可验证判据（数字、计数器、约束），要求判断并用判据论证；禁止"哪个更好"空问。
  create: |
    要求构造满足给定约束的产物（一个 Layout、一段修正代码、一组 launch 参数、一个 expect_tx 值），并且约束使合格答案可被机器或 rubric 判定。

difficulty:
  "1": |
    单一 API 或单一约束，一步可答；仍需给出完整前提，适合作为对照/入门题。
  "2": |
    一个场景 + 一个边界条件（对齐、mask、越界、架构差、单位换算）；两步推理。
  "3": |
    ≥2 个交互因素或 ≥3 步计算/推理；存在一个会被常见误解命中的错误答案。
  "4": |
    反直觉陷阱、跨架构语义差或 UB/内存模型细节；表面看起来合法，实际违反硬约束；需要精确阅读代码。

kind:
  mechanism: |
    问 A 导致 B 的硬件/执行模型理由；必须可证伪，禁止"因为硬件就是这样"。
  api: |
    调用方向、合法/非法、参数取值、返回码或 UB；优先 2–4 个片段/选项让学生逐一判定。
  formula: |
    出现可代入的数字或符号，输出唯一（占用、事务数、offset、bank、字节、带宽）；题干不得写出公式本身。
  feature: |
    点名架构或版本门槛（sm_80/90/90a/100a/120、CUDA x.y）以及一条可被违反的硬约束；禁止发布说明腔。
  failure: |
    静默错误、死锁、竞争或 UB：给出具体代码路径，问可观察后果与最小修复；UB 必须按 UB 表述。
  numeric: |
    给定具体数求结果；题干写出计算所需全部输入与单位；最好同时让"朴素算法"得到不同的错误值。

answer_format:
  single_choice: |
    4 个选项，恰好 1 个正确；每个干扰项对应一种具体误解（在 draft_rationale 中写明）。
  multi_choice: |
    4–6 个选项，正确项 ≥2 且不是全部；题干写"选出所有正确项"。
  numeric: |
    只要求一个数值，单位在题干中固定；draft_target 只写数字。
  multi_numeric: |
    2–4 个编号子问，每问一个数值/短结论；子问之间有递进关系而非堆砌。
  fill_in: |
    代码或公式中留 1–3 个空（用 ____A____ 标记），每空答案唯一。
  code_fix: |
    给出有缺陷的短代码（≤30 行），要求指出缺陷机制并给出最小修改；不得在注释中暗示缺陷位置。
  code_complete: |
    给出骨架，要求补全关键 1–5 行；补全结果需可编译或可按 rubric 判定。
  short_answer: |
    1–3 句可判定的结论 + 理由；rubric 2–4 条原子要点。
  trace_output: |
    给出确定性程序，问输出/最终状态；禁止依赖调度时序或 UB 的程序。
