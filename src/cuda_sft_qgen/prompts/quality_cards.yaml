bloom:
  remember: |
    一个可核对事实（API 签名、对齐字节、指令名、架构门槛）。禁止名词解释和术语表。
  understand: |
    机制因果：必须写出硬件/执行模型理由（为什么必须如此），不是复述定义。
  apply: |
    给定具体参数或代码，算出或选出正确用法；答案应可核对。
  analyze: |
    拆开 ≥2 个因素（同步×可见性、占用×延迟、TMA×对齐），指出决定结果的那一个。
  evaluate: |
    两个合法方案 + 可验证判据（数字、计数器、约束），不要空泛“哪个更好”。
  create: |
    补一行 / 一个 Layout / 一个公式结果，答案唯一。

difficulty:
  "1": |
    单 API 或单约束，数字可直接套公式或查表。
  "2": |
    一个场景 + 一个边界条件（对齐、mask、越界、架构差）。
  "3": |
    ≥2 个交互因素（占用×延迟、TMA×对齐、warp-group×barrier）。
  "4": |
    反直觉陷阱或跨架构语义差；表面看起来对，实际有硬约束。

kind:
  mechanism: |
    问 A 导致 B 的硬件/执行模型理由。必须可证伪，禁止“因为硬件就是这样”。
  api: |
    调用方向、合法/非法、UB。给 2～3 个片段或选项优于开放描述。
  formula: |
    必须出现可代入的数字或符号，输出唯一（占用、事务数、offset、bank、字节）。禁止“请推导性能模型”。
  feature: |
    必须点名架构或版本门槛（sm_80/90/100、Hopper、Blackwell、CUDA x.y）以及一条硬约束。禁止发布说明腔。
  failure: |
    静默错、死锁或可见性 bug：给出具体路径和可观察后果。
  numeric: |
    给定具体数求结果（驻留 CTA、sector 数、smem 字节）。写出计算所需输入。
