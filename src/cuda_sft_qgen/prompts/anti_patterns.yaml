patterns:
  - "[ask] 请介绍 / What is X / 名词解释，无可证伪约束"
  - "[ask] 谈谈你对 X 的理解 / 畅所欲言 / 任意发挥 / 请讨论 CUDA 优化"
  - "[how] 如何优化该 kernel（无数字、无代码、无计数器）"
  - "[how] 最佳实践清单 / 教程十条"
  - "[debug] 这段代码有什么问题（不指定观察现象，也不限定机制）"
  - "[leak] 第一句陈述规则，第二句问规则（'X 必须 16B 对齐。0x1008 合法吗？'）"
  - "[leak] 'your answer must mention (1)(2)(3)' / '要点包括…' 列出答案"
  - "[leak] 格式示例恰好是答案（'例如：32, 1'）"
  - "[leak] tests_claim 或 l3_claim 原句出现在题干"
  - "[choice] 单选题存在 0 个或 ≥2 个正确选项"
  - "[choice] 干扰项明显荒谬、与误解无关"
  - "[ub] 把未定义行为写成'必然死锁/必然崩溃/必然输出 X'"
  - "[arch] hardware=ampere 却出现 TMA/wgmma/tcgen05；sm_120 上使用 tcgen05；sm_90 写成 Blackwell"
  - "[premise] 求占用/字节/带宽却缺少 block 大小、架构、单位等必要输入"
  - "[dup] 同叶 stem 只换数字/变量名/语言"
  - "[what-if] 一次改动多个变量的反事实，答案不唯一"
  - "[metric] 编造 Nsight 指标名，或用'某个计数器会上升'代替具体指标"
  - "[format] verification_spec.mode=scalar 但题目要求解释或多个结果"
  - "[other] 博客开头 + 最后才提问 / 只有代码没有问句"
