patterns:
  - "[ask] 请介绍 / What is CUDA / 名词解释，无机制约束"
  - "[ask] 谈谈你对 {ID} 的理解，畅所欲言"
  - "[how] 如何优化该 kernel（无数字、无代码、无计数器）"
  - "[debug] 这段代码有什么问题（不指定同步/可见性/对齐机制）"
  - "[other] 题干已含逐步完整答案"
  - "[other] 博客开头 + 最后才提问"
  - "[ask] 同叶 stem 换词改写"
  - "[how] 最佳实践清单 / 教程十条"
  - "[what-if] 一次改太多变量的反事实"
  - "[ask] conceptual+remember 的术语表条目"
  - "[other] 只有代码没有问句"
  - "[ask] 把两条 angle 混在一题"
  - "[ask] hardware=hopper/blackwell 却写成架构无关的正确用法"
  - "[ask] tests_claim 原文复述 l3_claim"
  - "[ask] 任意发挥 / 请讨论 CUDA 优化"
