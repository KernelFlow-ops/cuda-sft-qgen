[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuda-sft-qgen"
version = "0.1.0"
description = "LangGraph multi-agent pipeline that generates a CUDA-knowledge SFT question set."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.11",
    "langchain>=1.4.0",
    "langchain-core>=1.6.3",
    "openai>=1.55.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
hf = ["sentence-transformers>=3.0.0"]

[project.scripts]
cuda-sft-qgen = "cuda_sft_qgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cuda_sft_qgen = ["prompts/*.md", "prompts/*.yaml", "prompts/layers/*.md", "prompts/taxonomy/*.md", "prompts/taxonomy/*.yaml", "viz/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
