[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuda-sft-qgen"
version = "0.1.0"
description = "LangGraph multi-agent pipeline that generates a CUDA-knowledge SFT question set."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.1.10",
    "openai>=1.55.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
hf = ["sentence-transformers>=3.0.0"]
verify = ["sympy>=1.12"]

[project.scripts]
cuda-sft-qgen = "cuda_sft_qgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cuda_sft_qgen = ["prompts/*.md", "prompts/*.yaml", "prompts/*.jsonl", "prompts/layers/*.md", "prompts/taxonomy/*.md", "prompts/taxonomy/*.yaml", "viz/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "llm: calls the real LLM/embedding API configured in .env (fails if unusable)",
    "eval: long evaluation runs used only by task T41",
    "gpu: requires nvcc and an NVIDIA GPU",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
