paths:
  taxonomy: configs/taxonomy/cuda.yaml
  quotas: configs/quotas.yaml
  personas: configs/personas.yaml
  data_dir: data
  scope: configs/scope.yaml
  compat_matrix: configs/compat_matrix.yaml
  angles: configs/angles.yaml
  hardware_facts: configs/hardware_facts.yaml
mixup:
  enabled: false
  fraction: 0.3
  modes:
  - decomposed
  - hybrid
  pair_similarity_min: 0.8
  pair_similarity_max: 0.995
  pair_top_k: 8
  max_pairs: 32
  max_pairs_per_item: 1
  max_parent_reuse: 3
  same_language: true
  same_granularity: true
  lsh_max_candidates: 128
  lsh_max_bucket_size: 64
  min_difficulty_gap: 1
  same_l2: true
  max_batch_items: 64
generation:
  temperature: 1.0
  top_p: 0.95
  max_tokens: 16384
  writer_concurrency: 6
  llm_per_key_concurrency: 2
  embed_per_key_concurrency: 2
  embed_oversub: 2
  embed_chunk_size: 8
  prompt_cache: true
  embedding_cache: true
  evolver_fraction: 0.3
  fewshot_positives: 5
  fewshot_negatives: 2
  anti_templates_max: 15
  fewshot_snippet_chars: 500
  fewshot_max_nn_cosine: 0.5
  fewshot_nn_cosine_fallback: 0.8
  fewshot_simhash_hamming_max: 20
  prompt_cot: true
  request_timeout_seconds: 90
  request_max_attempts: 3
  sieve_min_chars: 24
  max_parse_retries: 1
  priority_queue_size: 200
  backpressure_threshold: 0.2
  backpressure_sleep: 0.5
  min_generate_batch: null
  submit_stagger_sec: 0.35
  salvage_inline: false
  pending_save_every: 1
  writer_thinking_level: null
  writer_consistency_gate: true
  writer_gate_llm: false
  writer_gate_rewrite: true
  writer_gate_max_tokens: 512
  repair_concurrency: 2
  review_repair_enabled: true
  review_repair_max_attempts: 1
  fewshot_snippet_chars_code: 1200
knowledge:
  enabled: true
  audit_interval_seconds: 86400
  audit_batch_size: 20
  worker_poll_seconds: 5
  worker_max_jobs_per_run: 20
  expansion_cooldown_seconds: 300
  official_sources: []
  external_inventory_enabled: false
  inventory_sources: []
  external_inventory_interval_seconds: 86400
  external_inventory_max_sources: 8
  external_inventory_max_concepts: 500
  docs_dir: data/docs
  toolkit_version: 12.x
  legacy_batch_per_l2: 20
  legacy_due_days: 14
taxonomy:
  target_leaves_per_l2: 30
  target_leaf_count: 4500
  expand_max_per_call: 40
  manager:
    enabled: true
    every_k_reviews: 5
    max_llm_calls_per_tick: 2
    max_leaves_per_tick: 12
    health_expand_threshold: 70
    leaf_cosine_dup: 0.92
    leaf_cosine_gray: 0.85
    facets:
    - formula
    - derivation
    - failure
    - feature
    - mechanism
    - api
    - numeric
    - layout
    - profiling
    - arch_migrate
    - cross_factor
    allow_refine_in_pipeline: false
    allow_merge_in_pipeline: false
    allow_new_domains: false
    external_coverage_threshold: 0.8
    external_hard_trigger: true
review:
  thinking_level: medium
  max_tokens: 2048
  batch_size: 20
  top_k: 8
  semantic_dup_threshold: 0.94
  semantic_gray_threshold: 0.9
  template_jaccard_threshold: 0.91
  template_gray_jaccard: 0.82
  simhash_hamming_threshold: 3
  simhash_gray_hamming: 8
  kl_alert: 0.15
  entropy_ratio_alert: 0.85
  nn_cosine_alert: 0.8
  max_cluster_frac_alert: 0.25
  leaf_min_questions: 3
  leaf_coverage_target: 0.8
  overrep_factor: 2.0
  llm_every_k_batches: 1
  parallel_enabled: true
  chair_max_workers: 4
  chair_trigger_count: 1
  llm_per_key_concurrency: 1
  chair_batch_size: 10
  chair_flush_max: 8
  chair_slot_reserve: 1
  priority: 2
  answer_consistency_enabled: true
  answer_consistency_k: 3
  answer_consistency_min_agreement: 0.6
  answer_consistency_high_risk_k: 5
  solver_thinking_level: low
  solver_max_tokens: 3072
  verification_max_calls: 6
  verification_run_max_calls: 600
  verification_parallel_enabled: true
  verification_parallel_workers: 5
  execution_enabled: true
  execution_timeout_seconds: 20
  rip_enabled: true
  rip_keep_per_bucket: 3
  compile_timeout_seconds: 20
  second_pass_on_uncertain: true
  circuit_breaker_error_streak: 8
  circuit_breaker_exhausted: 20
  solver_thinking_level_hard: medium
  min_value_score: 3
  rip_min: 0.34
  mmr_lambda: 0.5
  gist_dup_threshold: 0.92
  gist_gray_threshold: 0.86
planner:
  joint_sampling: true
