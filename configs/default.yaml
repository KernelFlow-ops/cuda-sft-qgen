paths:
  taxonomy: configs/taxonomy/cuda.yaml
  quotas: configs/quotas.yaml
  personas: configs/personas.yaml
  data_dir: data

generation:
  temperature: 1.0
  top_p: 0.95
  max_tokens: 16384
  writer_concurrency: 6
  llm_per_key_concurrency: 2
  embed_per_key_concurrency: 2
  embed_oversub: 2
  embed_chunk_size: 8
  prompt_cache: true
  embedding_cache: true
  evolver_fraction: 0.30
  fewshot_positives: 5
  fewshot_negatives: 2
  anti_templates_max: 15
  fewshot_snippet_chars: 500
  fewshot_max_nn_cosine: 0.50
  fewshot_nn_cosine_fallback: 0.80
  fewshot_simhash_hamming_max: 20
  prompt_cot: false
  sieve_min_chars: 24
  max_parse_retries: 1
  priority_queue_size: 200
  backpressure_threshold: 0.20
  backpressure_sleep: 0.5
  # Never emit 1-2 brief batches that idle the writer pool.
  min_generate_batch: null
  # Stagger writer submits so a full pool does not hit the gateway in the same 200ms.
  submit_stagger_sec: 0.35
  # Salvage JSON in the salvage node, not on the writer thread.
  salvage_inline: false
  pending_save_every: 1
  # Inherit THINKING_LEVEL unless set. Prefer low/none for throughput.
  writer_thinking_level: null
  # Pre-chair consistency gate: local high-precision checks, then a cheap LLM
  # critic. Certain defects rewrite once; still-broken drafts never reach chair.
  writer_consistency_gate: true
  writer_gate_rewrite: true
  writer_gate_max_tokens: 512

knowledge:
  enabled: true
  audit_interval_seconds: 86400
  audit_batch_size: 20
  worker_poll_seconds: 5
  expansion_cooldown_seconds: 300
  official_sources: []

taxonomy:
  target_leaves_per_l2: 30
  target_leaf_count: 4500
  expand_max_per_call: 40
  manager:
    enabled: true
    every_k_reviews: 5
    max_llm_calls_per_tick: 2
    max_leaves_per_tick: 12
    health_expand_threshold: 70
    leaf_cosine_dup: 0.92
    leaf_cosine_gray: 0.85
    facets:
      - formula
      - derivation
      - failure
      - feature
      - mechanism
      - api
      - numeric
      - layout
      - profiling
      - arch_migrate
      - cross_factor
    allow_refine_in_pipeline: false
    allow_merge_in_pipeline: false
    allow_new_domains: false

review:
  thinking_level: medium
  max_tokens: 2048
  batch_size: 20
  top_k: 8
  semantic_dup_threshold: 0.94      # Was 0.93 - more strict semantic similarity
  semantic_gray_threshold: 0.90     # Was 0.88 - narrower gray zone
  template_jaccard_threshold: 0.91  # Was 0.88 - raise to reduce false positives
  template_gray_jaccard: 0.82       # Was 0.75 - wider gray zone
  simhash_hamming_threshold: 3
  simhash_gray_hamming: 8
  kl_alert: 0.15
  entropy_ratio_alert: 0.85
  nn_cosine_alert: 0.80
  max_cluster_frac_alert: 0.25
  leaf_min_questions: 3
  leaf_coverage_target: 0.80
  overrep_factor: 2.0
  llm_every_k_batches: 1
  # Parallel chair processing (Agent D)
  parallel_enabled: true            # Enable parallel LLM chair decisions
  chair_max_workers: 4              # Max parallel workers for chair decisions
  chair_batch_size: 10              # Batch size for gray items processing
  # Concurrent chair wave size. 20 blocked the next generate for minutes.
  chair_flush_max: 8
  # LLM slots writers may not take while a chair waiter exists (capacity>=2).
  chair_slot_reserve: 1
  # Writer=0 Salvage=1 Chair=2 Sieve=3 Taxonomy=4. Do not default Chair to Writer.
  priority: 2
  # Second independent chair call when first pass is uncertain on formula/debug/layout/code.
  second_pass_on_uncertain: true
  circuit_breaker_error_streak: 8
  circuit_breaker_exhausted: 20
