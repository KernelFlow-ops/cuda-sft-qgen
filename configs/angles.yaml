# Per question_type ask-shapes consumed by planner/sampling.load_angles(). Each card:
# id, ask, kinds (leaf kinds it suits), formats (answer_formats it suits), must_have, must_not.
angles:
  conceptual:
    - {id: con_why_constraint, ask: "给出一个具体现象，问其硬件/执行模型原因", kinds: [mechanism, feature], formats: [short_answer, single_choice],
       must_have: ["具体现象或代码", "可证伪的原因"], must_not: ["名词解释"]}
    - {id: con_plug_numbers, ask: "给定参数计算唯一结果", kinds: [formula, numeric], formats: [numeric, multi_numeric],
       must_have: ["全部输入与单位", "朴素算法会得到不同值"], must_not: ["写出公式本身"]}
    - {id: con_true_false_set, ask: "多个陈述中选出全部正确项", kinds: [feature, mechanism, api], formats: [multi_choice],
       must_have: ["每个错误项对应一种误解"], must_not: ["全对或全错"]}
    - {id: con_reverse, ask: "给出结果反求缺失参数", kinds: [formula, numeric], formats: [numeric, multi_numeric],
       must_have: ["唯一可反解"], must_not: ["多解"]}
  syntax:
    - {id: syn_legal_set, ask: "判断多条调用/PTX 中哪些合法", kinds: [api, feature], formats: [multi_choice, single_choice],
       must_have: ["2-5 条片段", "合法性差异源于一个具体规则"], must_not: ["编造的 API"]}
    - {id: syn_param_value, ask: "填写使调用合法的参数/属性值", kinds: [api], formats: [fill_in, short_answer],
       must_have: ["具体上下文与数值"], must_not: ["格式示例含答案"]}
    - {id: syn_return_code, ask: "给定调用序列，问返回的错误/状态", kinds: [api, failure], formats: [short_answer, single_choice],
       must_have: ["完整调用序列"], must_not: ["依赖未写明的环境"]}
  code_complete:
    - {id: cc_fill_sync, ask: "补全缺失的同步/等待语句", kinds: [mechanism, failure], formats: [fill_in, code_complete],
       must_have: ["骨架代码", "空位 ≤3"], must_not: ["注释提示答案"]}
    - {id: cc_fill_args, ask: "补全调用参数（维度/leading dim/字节数）", kinds: [api, formula], formats: [fill_in],
       must_have: ["存储布局与尺寸"], must_not: ["多解"]}
    - {id: cc_fill_index, ask: "补全索引/地址计算表达式", kinds: [formula, numeric], formats: [fill_in, code_complete],
       must_have: ["layout 或访问约束"], must_not: []}
  debug:
    - {id: dbg_observable, ask: "给出缺陷代码，问可观察后果与最小修复", kinds: [failure], formats: [code_fix, short_answer],
       must_have: ["≤30 行代码", "单一根因"], must_not: ["'有什么问题'无限定", "UB 写成确定结果"]}
    - {id: dbg_tool_output, ask: "给出工具报告/现象，定位根因", kinds: [failure, api], formats: [short_answer, single_choice],
       must_have: ["真实工具名与报告类型"], must_not: ["编造报告字段"]}
    - {id: dbg_ub_classify, ask: "判断代码行为是否被定义并说明", kinds: [failure, mechanism], formats: [single_choice, short_answer],
       must_have: ["UB/合法的精确界定"], must_not: []}
  optimization:
    - {id: opt_given_metrics, ask: "给定剖析数据，判断某优化是否有效并给依据", kinds: [mechanism, numeric], formats: [short_answer],
       must_have: ["具体指标数值"], must_not: ["无数字的'如何优化'"]}
    - {id: opt_compare_counts, ask: "比较两种实现的指令/事务/字节数", kinds: [numeric, formula], formats: [multi_numeric],
       must_have: ["两个具体实现"], must_not: []}
    - {id: opt_constraint_violation, ask: "某优化引入的约束违规及后果", kinds: [api, failure], formats: [short_answer, code_fix],
       must_have: ["具体优化手段"], must_not: []}
  layout:
    - {id: lay_offset, ask: "计算 Layout 在给定坐标/索引的 offset", kinds: [formula], formats: [multi_numeric],
       must_have: ["Shape:Stride", "至少一个 1-D 索引"], must_not: []}
    - {id: lay_bank_swizzle, ask: "计算 bank 冲突路数或 swizzle 后地址", kinds: [mechanism, formula], formats: [multi_numeric],
       must_have: ["行字节数与访问集合"], must_not: []}
    - {id: lay_property, ask: "判断 layout 性质（双射、cosize、可合并）", kinds: [formula, mechanism], formats: [short_answer, multi_choice],
       must_have: ["具体 layout"], must_not: []}
    - {id: lay_tma_box, ask: "判断 TMA box/stride/swizzle 配置合法性", kinds: [feature, api], formats: [multi_choice],
       must_have: ["dtype、globalDim、boxDim、swizzle"], must_not: []}
  compare:
    - {id: cmp_arch_gate, ask: "同一需求在两个架构上的合法实现与差异", kinds: [feature], formats: [short_answer, multi_choice],
       must_have: ["两个具名架构"], must_not: ["'新架构更快'"]}
    - {id: cmp_two_apis, ask: "两个 API/格式在一个可观察量上的差异", kinds: [api, numeric, mechanism], formats: [multi_numeric, short_answer],
       must_have: ["同一场景下的两种写法"], must_not: []}
    - {id: cmp_semantics, ask: "三种配置下的执行/同步语义对照", kinds: [mechanism], formats: [short_answer],
       must_have: ["逐一编号的配置"], must_not: []}
  counterfactual:
    - {id: cf_remove_one, ask: "删除/修改一处同步或参数，问新增的冒险或错误", kinds: [failure, mechanism], formats: [short_answer],
       must_have: ["只改变一个前提并明确写出"], must_not: ["同时改多处"]}
    - {id: cf_change_arch, ask: "同一代码换到另一架构，问哪一步失效", kinds: [feature], formats: [short_answer, single_choice],
       must_have: ["两个架构"], must_not: []}
    - {id: cf_edge_case, ask: "边界输入（尾块、越界 tile）下结果是否变化", kinds: [numeric, failure], formats: [multi_numeric, short_answer],
       must_have: ["具体边界数值"], must_not: []}
  profiling:
    - {id: prof_metric_value, ask: "给定访问模式，计算某具名指标的值或比值", kinds: [numeric, formula], formats: [multi_numeric],
       must_have: ["真实指标名"], must_not: ["编造指标"]}
    - {id: prof_metric_direction, ask: "改动后哪个具名指标变化、方向与原因", kinds: [mechanism, failure], formats: [short_answer],
       must_have: ["改动前后代码"], must_not: []}
    - {id: prof_timeline, ask: "解读 Nsight Systems 时间线现象的原因", kinds: [failure, mechanism], formats: [short_answer],
       must_have: ["描述的时间线现象"], must_not: []}
