# Scope v3 —— 对齐仓库真实的 31 个 L1（configs/taxonomy/cuda.yaml）。
# 语义（由 scripts/merge_scope.py 执行，T32）：
#   weight            -> 写入 L1 字典（仅当缺失时），作为规划器 L1 先验（替代均匀分布）
#   default_target    -> 该 L1 下所有 L2 的 target_leaves 默认值（仅当 L2 缺失该键时写入）
#   l2_overrides      -> 对已有 L2 写入 arch / target_leaves（仅当缺失时）；未列出的 L2 视为 arch=[any]
#   new_l2            -> 新增的 L2（空叶子，由知识扩展生成 provisional 叶子）
# 只增不删；已有 id/name/leaves 永不改动。
