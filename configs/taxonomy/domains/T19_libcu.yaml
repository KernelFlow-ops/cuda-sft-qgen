    claim: cuda::std::span<T> 是非拥有视图，size() 返回元素个数；它不分配 device 内存，data() 必须已指向合法对象。
    types:
    - syntax
    - debug
    difficulty:
    - 2
    kind: api
  - id: cuda_std_complex
    claim: cuda::std::complex<float> 的 operator* 为 (a+bi)*(c+di)=(ac-bd)+(ad+bc)i，不是 float2 的逐元素乘。
    types:
    - conceptual
    - debug
    difficulty:
    - 2
    - 3
    kind: formula
  - id: cuda_std_optional
    claim: cuda::std::optional<T> 在 device 上不可抛 bad_optional_access；应先 has_value()/value_or，不能靠异常控制流。
    types:
    - debug
    - syntax
    difficulty:
    - 2
    - 3
    kind: failure
  - id: cuda_std_libcxx
    claim: libcu++ 的 cuda::std 从 CUDA 11 随工具链提供，CUDA 12.4+ 与 CCCL 统一；#include <optional> 不等于 cuda::std::optional。
    types:
    - syntax
    - conceptual
    difficulty:
    - 2
    kind: feature
  - id: cuda_std_array
    claim: cuda::std::array<T,N> 的 sizeof = N*sizeof(T)（无堆分配）；N 必须是编译期常量，不能用运行时 n 当模板实参。
    types:
    - syntax
    - layout
    difficulty:
    - 1
    - 2
    kind: formula
  - id: cuda_std_expected
    claim: CCCL 的 cuda::std::expected<T,E> 用 has_value() 区分值域；device 上 unexpected 路径同样不能抛异常。
    types:
    - syntax
    - conceptual
    difficulty:
    - 3
    kind: api
  target_leaves: 10
- id: cuda_atomic
  name: cuda::atomic
  leaves:
  - id: cuda_atomic_owns
    claim: cuda::atomic<T, Scope> 拥有 T 的存储，对象必须按 alignof(cuda::atomic<T>) 对齐；与 atomic_ref 覆盖已有 T 不同。
    types:
    - conceptual
    - compare
    difficulty:
    - 2
    - 3
    kind: mechanism
  - id: cuda_atomic_ctor
    claim: 静态 __shared__ cuda::atomic<int, thread_scope_block> 需要显式 store/cuda::init，未初始化值不是可移植的 0。
    types:
    - debug
    - syntax
    difficulty:
    - 2
    - 3
    kind: api
  - id: cuda_atomic_fetch_add
    claim: fetch_add 返回旧值；memory_order_relaxed 不与他线程的 non-atomic 写建立 happens-before。
    types:
    - syntax
    - debug
    difficulty:
    - 2
    - 3
    kind: api
  - id: cuda_atomic_system
    claim: cuda::atomic<int, thread_scope_system> 才能与 host 或 peer 的 system-scope 操作配对；thread_scope_device
      对 CPU 无可见性保证。
    types:
    - conceptual
    - compare
    difficulty:
    - 2
    - 3
    kind: mechanism
  - id: cuda_atomic_wait
    claim: CUDA 11+ 的 device cuda::atomic 不保证提供 C++20 wait/notify；把 host wait 语义套到 kernel 会编译失败或退化成忙等。
    types:
    - syntax
    - debug
    difficulty:
    - 3
    kind: feature
  - id: cuda_atomic_lock_free
    claim: 对齐的 32-bit cuda::atomic 在 device 上 is_always_lock_free==true；对超出硬件宽度的 struct 特化会静态失败。
    types:
    - conceptual
    - syntax
    difficulty:
    - 2
    - 3
    kind: numeric
  - id: cuda_atomic_thread_scope
    claim: thread_scope_thread 的 atomic 只约束本线程编译器重排，不向他线程发布；不能当 CTA 锁。
    types:
    - debug
    - counterfactual
    difficulty:
    - 3
    kind: failure
  - id: cuda_atomic_ptx_width
    claim: device 上 sizeof(T)=4 的 cuda::atomic 编译为 32-bit atom，sizeof(T)=8 为 64-bit atom；scope 编码进 PTX
      .cta/.gpu/.sys。
    types:
    - conceptual
    - compare
    difficulty:
    - 3
    kind: numeric
  target_leaves: 10
- id: memcpy_async_lib
  name: cuda::memcpy_async
  leaves:
  - id: memcpy_async_lib_group
    claim: cuda::memcpy_async(group, dst, src, size, barrier) 由 group 内线程协作拷贝；只让 1 线程调用却按整块 size 计算，会漏拷或越界。
    types:
    - syntax
    - debug
    difficulty:
    - 3
    kind: api
  - id: memcpy_async_lib_aligned
    claim: cuda::aligned_size_t<16>(n) 要求 n%16==0 且指针 16B 对齐才能走 16B cp.async；n=12 不能用 aligned_size_t<16>。
    types:
    - syntax
    - layout
    difficulty:
    - 2
    - 3
    kind: formula
  - id: memcpy_async_lib_barrier
    claim: 以 barrier 为完成对象时拷贝完成自动 arrive；调用方不要再额外 arrive 一次，否则 expected 会提前耗尽。
    types:
    - debug
    - conceptual
    difficulty:
    - 3
    kind: mechanism
  - id: memcpy_async_lib_pipeline
    claim: 以 pipeline 为完成对象时，拷贝挂到当前 producer stage，必须先 producer_acquire 再 memcpy_async 再 commit。
    types:
    - syntax
    - debug
    difficulty:
    - 3
    kind: api
  - id: memcpy_async_lib_sm80
    claim: CUDA 11.0+ 在 sm_80 把 cuda::memcpy_async 降到 cp.async；sm_90 仍可用该 API，但不会自动变成 TMA bulk。
    types:
    - conceptual
    - compare
    difficulty:
    - 3
    kind: feature
  - id: memcpy_async_lib_dst
    claim: 异步路径的 dst 必须是合法 shared（或文档允许的异步目的）；dst 在 generic global 上不能当 smem staging，行为非法。
    types:
    - debug
    - counterfactual
    difficulty:
    - 3
    kind: failure
  - id: memcpy_async_lib_bytes
    claim: 传输字节数 = size 参数；aligned_size_t<16>(64) 拷 64 字节 = 4 个 16B 事务，不是 64 个元素。
    types:
    - conceptual
    - debug
    difficulty:
    - 2
    kind: numeric
  - id: memcpy_async_lib_fallback
    claim: 在不支持 cp.async 的架构上 memcpy_async 同步完成仍会 arrive barrier，因此 Stages>1 在 sm_70 上不会缩短关键路径。
    types:
    - optimization
    - profiling
    difficulty:
    - 3
    kind: mechanism
  target_leaves: 10
- id: cuda_semaphore
  name: latch 与 semaphore
  leaves:
  - id: cuda_semaphore_counting
    claim: cuda::counting_semaphore<Scope, LeastMaxValue> 的计数上限至少为 LeastMaxValue；release(n) 把计数加 n。
    types:
    - syntax
    - conceptual
    difficulty:
    - 2
    - 3
    kind: api
  - id: cuda_semaphore_binary
    claim: cuda::binary_semaphore<Scope> 等价于 LeastMaxValue=1 的 counting_semaphore；无配对 acquire 时连续 release
      两次是 UB。
    types:
    - syntax
    - debug
    difficulty:
    - 2
    - 3
    kind: formula
  - id: cuda_semaphore_acquire
    claim: acquire() 在计数为 0 时阻塞；block-scope semaphore 必须放在参与线程共享的 shared 内存。
    types:
    - debug
    - conceptual
    difficulty:
    - 2
    - 3
    kind: mechanism
  - id: cuda_semaphore_latch_init
    claim: cuda::latch<Scope> 的 expected 在构造/init 时固定，不能在 count_down 之后再改 expected。
    types:
    - syntax
    - conceptual
    difficulty:
    - 2
    kind: api
  - id: cuda_semaphore_latch_wait
    claim: latch.arrive_and_wait() = count_down(1) 然后 wait 到计数 0；只 wait 不 count_down 会永久阻塞。
    types:
    - debug
    - conceptual
    difficulty:
    - 2
    - 3
    kind: formula
  - id: cuda_semaphore_scope
    claim: thread_scope_block 的 semaphore/latch 不能跨 CTA acquire/release；跨 CTA 要用 thread_scope_device 且对象在
      global。
    types:
    - compare
    - debug
    difficulty:
    - 3
    kind: mechanism
  - id: cuda_semaphore_latch_max
    claim: latch::max() 是 expected 上限；expected=0 的 latch 一开始就 ready，wait 立即返回。
    types:
    - conceptual
    - counterfactual
    difficulty:
    - 2
    kind: formula
  - id: cuda_semaphore_cuda11
    claim: cuda::counting_semaphore 与 cuda::latch 随 CUDA 11 libcu++ 提供；device 上 try_acquire 失败不抛异常。
    types:
    - syntax
    - conceptual
    difficulty:
    - 2
    kind: feature
  target_leaves: 10
- id: access_policy
  name: Access Policy Window
  leaves:
  - id: access_policy_window
    claim: cudaAccessPolicyWindow 的 base_ptr+num_bytes 指定 VA 窗口；hitProp=cudaAccessPropertyPersisting 才请求
      L2 钉住。
    types:
    - syntax
    - optimization
    difficulty:
    - 3
    kind: api
  - id: access_policy_hit_ratio
    claim: hitRatio ∈ [0.0, 1.0] 表示窗口内按该比例走 hitProp；hitRatio=0 等价于不申请 persisting 容量。
    types:
    - optimization
    - conceptual
    difficulty:
    - 3
    kind: formula
  - id: access_policy_stream
    claim: cudaStreamSetAttribute(stream, cudaStreamAttributeAccessPolicyWindow, &attr) 把窗口绑到该 stream，不是进程全局。
    types:
    - syntax
    - conceptual
    difficulty:
    - 3
    kind: api
  - id: access_policy_sm80
    claim: L2 persistence 与 Access Policy Window 是 sm_80+；sm_75 上设置窗口没有对应硬件路径。
    types:
    - conceptual
    - compare
    difficulty:
    - 3
    kind: feature
  - id: access_policy_reset
    claim: 用完必须把窗口重置为 num_bytes=0 或 hitProp=Normal，否则后续无关 kernel 仍可能占 persisting 容量。
    types:
    - debug
    - optimization
    difficulty:
    - 3
    kind: failure
  - id: access_policy_discard
    claim: sm_80+ 的 discard 提示该地址不再复用；它不释放 VA，也不保证该行立刻从 L2 消失。
    types:
    - conceptual
    - optimization
    difficulty:
    - 3
    kind: mechanism
  - id: access_policy_a100_l2
    claim: A100 L2 容量 = 40 MiB，persisting 窗口有效容量受此上限；窗口大于 L2 时不能指望全部钉住。
    types:
    - profiling
    - optimization
    difficulty:
    - 3
    kind: numeric
  - id: access_policy_miss_prop
    claim: missProp 描述未命中/窗口外流量，常用 cudaAccessPropertyStreaming；把它设成 Persisting 不会把整个 L2 变成 pinned。
    types:
    - optimization
    - compare
    difficulty:
    - 3
    kind: api
  target_leaves: 10
