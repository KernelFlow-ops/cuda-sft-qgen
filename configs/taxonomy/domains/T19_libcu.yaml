      的否定分支。
    types:
    - syntax
    - compare
    difficulty:
    - 3
    kind: feature
  - id: nv_target_no_runtime
    claim: NV_IF_TARGET 在编译期展开，不能用运行时查询的 SM 版本变量去选择 NV_PROVIDES_SM_* 分支。
    types:
    - debug
    - counterfactual
    difficulty:
    - 3
    kind: failure
  - id: nv_target_header
    claim: '必须 #include <nv/target>；该头由 CUDA 11.2+ 工具链提供，cuda_runtime.h 不保证间接包含它。'
    types:
    - syntax
    - conceptual
    difficulty:
    - 2
    kind: feature
  - id: nv_target_scope
    claim: NV_IF_TARGET 各通道语句块是独立词法作用域，块内声明不会泄漏到另一通道；跨通道共用同一 auto 变量会编译失败。
    types:
    - syntax
    - debug
    difficulty:
    - 2
    - 3
    kind: api
  target_leaves: 10
- id: cuda_std
  name: cuda::std
  leaves:
  - id: cuda_std_atomic_scope
    claim: cuda::std::atomic<T> 没有 thread_scope 模板参数，device 上默认可见性不等于 cuda::atomic<T, thread_scope_system>。
    types:
    - compare
    - conceptual
    difficulty:
    - 3
    kind: mechanism
