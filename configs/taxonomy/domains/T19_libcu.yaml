id: T19
name: 'libcu++ / cuda::'
weight: 0.7
children:
- id: cuda_barrier
  name: cuda::barrier
  leaves:
  - id: cuda_barrier_arrive_wait
    claim: cuda::barrier<cuda::thread_scope_block> 的 arrive 只减少期望计数，必须 wait/arrive_and_wait 才同步；arrive
      本身不保证看到他线程此前的 shared 写。
    types:
    - conceptual
    - debug
    difficulty:
    - 2
    - 3
    kind: mechanism
  - id: cuda_barrier_init
    claim: cuda::init(&bar, expected) 必须由参与线程在第一次 arrive 之前调用一次；expected 必须等于每 phase 的 arrive 次数，否则永久阻塞。
    types:
    - syntax
    - debug
    difficulty:
    - 2
    - 3
    kind: api
    hints:
    - expected=blockDim.x 但只有 1 线程 arrive
    - 重复 init
  - id: cuda_barrier_token_phase
    claim: arrive() 返回的 arrival_token 绑定当前 phase；wait(token) 等到该 phase 完成，跨 phase 复用旧 token 会等到错误的一轮或死等。
    types:
    - debug
    - conceptual
    difficulty:
    - 3
    kind: mechanism
  - id: cuda_barrier_memcpy_async
    claim: CUDA 11+ 的 cuda::memcpy_async(group, dst, src, bytes, barrier) 在拷贝完成后自动 arrive；在 sm_80 下降到
      cp.async，在更早架构上同步拷贝。
    types:
    - syntax
    - conceptual
    difficulty:
    - 3
    kind: feature
  - id: cuda_barrier_scope
    claim: thread_scope_block 的 barrier 只同步同一 CTA；thread_scope_device 才能跨 CTA，且对象必须在参与者都看得见的 global 上，不能替代
      __syncthreads 的控制流汇合。
    types:
    - conceptual
    - compare
    difficulty:
    - 2
    - 3
    kind: mechanism
  - id: cuda_barrier_arrive_n
    claim: arrive(n) 一次把本 phase 期望计数减 n；n>1 时其余线程的 arrive 次数必须按同一额度减少，否则少到永远 wait。
    types:
    - syntax
    - debug
    difficulty:
    - 3
    kind: api
  - id: cuda_barrier_arrive_and_drop
    claim: arrive_and_drop() 完成本 phase arrive 并把后续 phase 的 expected 减 1；提前 return 的线程应 drop 而不是跳过，否则 expected
      偏高而死等。
    types:
    - debug
    - counterfactual
    difficulty:
    - 3
    - 4
    kind: failure
    hints:
    - threadIdx.x>=N 直接 return 未 drop
    - drop 两次
  - id: cuda_barrier_max
    claim: init(&bar, expected) 要求 1 ≤ expected ≤ cuda::barrier<Scope>::max()；expected=0 使 phase 立即完成或成为非法
      init。
    types:
    - syntax
    - conceptual
    difficulty:
    - 2
    - 3
    kind: formula
  - id: cuda_barrier_align
    claim: shared 中的 cuda::barrier 对象必须至少 8B 对齐；未对齐的 init/arrive 是未定义行为，不是自动 pad。
    types:
    - debug
    - layout
    difficulty:
    - 2
    - 3
    kind: numeric
  - id: cuda_barrier_phase_inc
    claim: 全部 arrive 完成后 phase 计数加 1；wait(token) 等到 token 所属那一轮完成，而不是等到下一次任意 arrive。
    types:
    - conceptual
    - debug
    difficulty:
    - 3
    kind: mechanism
  target_leaves: 10
- id: cuda_pipeline
  name: cuda::pipeline
  leaves:
  - id: cuda_pipeline_acquire_commit
    claim: producer_acquire 占用流水线头阶段，随后的 memcpy_async 挂到该阶段，producer_commit 才封阶段；acquire 后不 commit 会占死
      stage。
    types:
    - debug
    - conceptual
    difficulty:
    - 3
    kind: mechanism
  - id: cuda_pipeline_libcu_shared_state
    claim: cuda::pipeline_shared_state<Scope, Stages> 把最大未完成阶段数固定为 Stages；非 thread_scope_thread 的 pipeline
      必须引用该对象，否则无法协调多线程。
    types:
    - syntax
    - layout
    difficulty:
    - 3
    kind: formula
  - id: cuda_pipeline_wait_prior
    claim: pipeline_consumer_wait_prior<N>(pipe) 等到未完成阶段数 ≤ N；对深度 S 的流水线，计算当前 stage 时应 wait_prior<S-1>。
    types:
    - optimization
    - debug
    difficulty:
    - 3
    kind: formula
  - id: cuda_pipeline_quit
    claim: cuda::pipeline::quit() 之后再 producer_commit/consumer_wait 是未定义行为，异步拷贝可能永远不完成。
    types:
    - debug
    - counterfactual
    difficulty:
    - 3
    kind: failure
  - id: cuda_pipeline_make
    claim: cuda::make_pipeline(group, &shared_state) 把 cooperative_groups 线程组绑到 pipeline_shared_state；group.size()
      必须覆盖全部 producer 与 consumer 线程。
    types:
    - syntax
    - code_complete
    difficulty:
    - 3
    kind: api
  - id: cuda_pipeline_consumer_release
    claim: consumer_wait 之后必须 consumer_release 才能让 producer 复用该 stage；只 wait 不 release 会把深度 S 的流水线卡死。
    types:
    - debug
    - conceptual
    difficulty:
    - 3
    kind: mechanism
  - id: cuda_pipeline_libcu_thread_scope
    claim: thread_scope_thread 的 pipeline 不需要 pipeline_shared_state；block/device scope 必须提供 Stages 个 stage
      的共享状态对象。
    types:
    - syntax
    - compare
    difficulty:
    - 2
    - 3
    kind: api
  - id: cuda_pipeline_sm80
    claim: CUDA 11.1+ 在 sm_80 上 cuda::pipeline + memcpy_async 映射到 cp.async.commit_group；sm_70 回退同步拷贝，Stages>1
      不再隐藏延迟。
    types:
    - conceptual
    - compare
    difficulty:
    - 3
    kind: feature
  - id: cuda_pipeline_role_mix
    claim: producer_acquire/commit 只能由 producer 角色调用，consumer_wait/release 只能由 consumer 调用；同一线程混用角色会破坏
      stage 计数。
    types:
    - debug
    - counterfactual
    difficulty:
    - 3
    - 4
    kind: failure
    hints:
    - 同一 warp 既 commit 又 wait
    - consumer 调 producer_acquire
  - id: cuda_pipeline_depth_ilp
    claim: 深度 S 允许最多 S 个未完成拷贝；与计算重叠需要 S≥2，S=1 时 wait_prior<0> 等价于同步拷贝。
    types:
    - optimization
    - profiling
    difficulty:
    - 3
    kind: formula
  target_leaves: 10
- id: annotated_ptr
  name: annotated_ptr
  leaves:
  - id: annotated_ptr_access_property
    claim: cuda::annotated_ptr 把 cuda::access_property 绑到指针，编译为带 cache 提示的 ld/st；属性不改变地址空间，也不会让别名对象自动继承提示。
    types:
    - conceptual
    - optimization
    difficulty:
    - 3
    kind: mechanism
  - id: annotated_ptr_streaming
    claim: cuda::access_property::streaming 标记为流式、低复用，对应 L1/L2 evict-first 类提示，适合读一次的扫表而不是热 tile。
    types:
    - syntax
    - optimization
    difficulty:
    - 3
    kind: api
  - id: annotated_ptr_persisting
    claim: sm_80+ 的 access_property::persisting 配合 cudaAccessPolicyWindow 把指定 VA 窗口钉在 L2；在 sm_70 上该窗口
      API 不可用。
    types:
    - optimization
    - conceptual
    difficulty:
    - 3
    kind: feature
  - id: annotated_ptr_space_mismatch
    claim: 用 global 空间的 annotated_ptr 指向 shared 地址并发 ld.global，会按错误空间寻址，属于静默错误而非类型系统捕获。
    types:
    - debug
    - counterfactual
    difficulty:
    - 3
    - 4
    kind: failure
  - id: annotated_ptr_normal
    claim: access_property::normal 是默认缓存提示，不创建 L2 persistence 窗口；把它当成 persisting 不会钉住热 tile。
    types:
    - conceptual
    - compare
    difficulty:
    - 2
    - 3
    kind: api
  - id: annotated_ptr_hit_ratio
    claim: cuda::access_property(persisting, hit_ratio) 的 hit_ratio ∈ [0,1]；0 表示窗口内不申请保留，1 表示尽量全部走 persisting。
    types:
    - syntax
    - optimization
    difficulty:
    - 3
    kind: formula
  - id: annotated_ptr_alias
    claim: 只有经 annotated_ptr 的解引用才带提示；同一地址的普通 T* 别名访问不继承 access_property。
    types:
    - debug
    - conceptual
    difficulty:
    - 3
    kind: mechanism
  - id: annotated_ptr_space_type
    claim: cuda::annotated_ptr 的地址空间写在类型里（global vs shared）；不能 static_cast 成另一种空间指针来改寻址，否则仍按原空间发 ld/st。
    types:
    - syntax
    - debug
    difficulty:
    - 3
    kind: api
  - id: annotated_ptr_l2_cap
    claim: A100 L2=40 MiB，persisting 窗口有效容量受此上限；窗口总和超过可用 persisting 容量时按 hitRatio 驱逐，不会无限钉住。
    types:
    - optimization
    - profiling
    difficulty:
    - 3
    kind: numeric
  target_leaves: 10
- id: mdspan
  name: mdspan
  leaves:
  - id: mdspan_layout_mapping
    claim: cuda::std::mdspan 的 layout_mapping(i0,i1,...) 把多维索引映射为唯一 offset，layout_right 是行主序，layout_left
      是列主序。
    types:
    - layout
    - conceptual
    difficulty:
    - 2
    - 3
    kind: mechanism
  - id: mdspan_ctor
    claim: cuda::std::mdspan<T, extents<int, D0, D1>> 需要指针与 extents；运行时 extents 用 dynamic_extent，编译期静态维可进寄存器。
    types:
    - syntax
    - code_complete
    difficulty:
    - 2
    - 3
    kind: api
  - id: mdspan_offset
    claim: layout_right 二维 offset(i,j) = i * extent(1) + j；layout_left 的 offset(i,j) = i + j * extent(0)。
    types:
    - layout
    - conceptual
    difficulty:
    - 2
    kind: formula
  - id: mdspan_device_cccl
    claim: device 端 cuda::std::mdspan 属于 CCCL/libcu++，CUDA 12+ 工具链提供；不能把 host std::mdspan 直接 __device__
      解引用到 device 指针。
    types:
    - syntax
    - debug
    difficulty:
    - 2
    - 3
    kind: feature
  - id: mdspan_layout_stride
    claim: layout_stride 的 offset(i,j) = i*stride(0) + j*stride(1)；stride 可与 extent 独立，不必等于行距或列距。
    types:
    - layout
    - conceptual
    difficulty:
    - 2
    - 3
    kind: formula
  - id: mdspan_rank
    claim: extents<Index, D0, D1, D2> 的 rank()=3；rank_dynamic() 等于取 dynamic_extent 的维数。
    types:
    - syntax
    - conceptual
    difficulty:
    - 2
    kind: formula
  - id: mdspan_accessor
    claim: default_accessor 不做边界检查；越界 operator() 是 UB，不会抛异常或返回哨兵。
    types:
    - debug
    - counterfactual
    difficulty:
    - 2
    - 3
    kind: failure
  - id: mdspan_dextents
    claim: cuda::std::dextents<int,2> 两维都是 runtime；与 extents<int,64,dynamic_extent> 的静态 64 相比，动态维不能当编译期
      tile 尺寸。
    types:
    - syntax
    - compare
    difficulty:
    - 2
    - 3
    kind: api
  - id: mdspan_submdspan
    claim: CUDA 12+ CCCL 的 cuda::std::submdspan(md, slice0, slice1) 返回视图不拷贝元素；源指针生命周期必须覆盖子视图。
    types:
    - syntax
    - conceptual
    difficulty:
    - 3
    kind: feature
  target_leaves: 10
- id: atomic_ref
  name: atomic_ref
  leaves:
  - id: atomic_ref_overlay
    claim: cuda::atomic_ref<T, Scope> 不拥有存储，只覆盖已有对象；被覆盖对象必须按 alignof(T) 对齐，否则原子访问未定义。
    types:
    - conceptual
    - debug
    difficulty:
    - 3
    kind: mechanism
  - id: atomic_ref_fetch_add
    claim: atomic_ref::fetch_add(v, memory_order_relaxed) 返回旧值并原子加上 v；memory_order 与 thread_scope 都是模板/参数，缺省不等于
      system 可见。
    types:
    - syntax
    - debug
    difficulty:
    - 2
    - 3
    kind: api
  - id: atomic_ref_lock_free
    claim: device 上 32/64-bit 对齐 atomic_ref 是 lock-free；128-bit CAS 仅在支持的 SM 与对齐下 lock-free，否则可能走锁路径或编译失败。
    types:
    - conceptual
    - compare
    difficulty:
    - 3
    kind: numeric
  - id: atomic_ref_ptx
    claim: device 上 cuda::atomic_ref 的指令宽度 = sizeof(T)（常用 32/64 bit），并编码进 PTX atom 的 scope/order，而不是 host
      std::atomic_ref 的锁实现。
    types:
    - conceptual
    - compare
    difficulty:
    - 3
    kind: numeric
  - id: atomic_ref_scope
    claim: cuda::atomic_ref<T, cuda::thread_scope_block> 的 RMW 只与同 CTA 建立同步；跨 CTA 需要 thread_scope_device。
    types:
    - conceptual
    - debug
    difficulty:
    - 2
    - 3
    kind: mechanism
  - id: atomic_ref_cas
    claim: compare_exchange_strong(expected, desired, success, failure) 失败时把旧值写回 expected；success 不能比
      failure 更弱（acq_rel+relaxed 合法，relaxed+acquire 不合法）。
    types:
    - syntax
    - debug
    difficulty:
    - 3
    kind: api
  - id: atomic_ref_fetch_min
    claim: cuda::atomic_ref 的 fetch_min/fetch_max 是 CUDA 扩展，对有符号整数按数值比较，不是按位模式比较。
    types:
    - syntax
    - compare
    difficulty:
    - 2
    - 3
    kind: api
  - id: atomic_ref_16bit
    claim: sm_70+ 才保证对齐的 16-bit atomic_ref RMW 为 lock-free；sm_60 上 16-bit 原子可能编译失败或非 lock-free。
    types:
    - conceptual
    - compare
    difficulty:
    - 3
    kind: feature
  - id: atomic_ref_const
    claim: 不能用 atomic_ref 覆盖 const 对象来去掉 const 再原子写，那是 UB，即使底层地址在可变内存。
    types:
    - debug
    - counterfactual
    difficulty:
    - 3
    kind: failure
  target_leaves: 10
- id: cuda_ptx
  name: cuda::ptx
  leaves:
  - id: cuda_ptx_header
    claim: CUDA 12.1+ 的 <cuda/ptx> 在 cuda::ptx 命名空间提供 PTX 包装，立即数参数类型是 cuda::ptx::n32_t 等，不是随意 int。
    types:
    - syntax
    - conceptual
    difficulty:
    - 3
    kind: feature
  - id: cuda_ptx_mbarrier_init
    claim: cuda::ptx::mbarrier_init(mbar, count) 对应 mbarrier.init，count 是 arrive 期望；必须在 shared 且 8B 对齐的
      64-bit 对象上调用。
    types:
    - syntax
    - debug
    difficulty:
    - 3
    kind: api
  - id: cuda_ptx_expect_tx
    claim: cuda::ptx::mbarrier_arrive_expect_tx 把随后 bulk/TMA 的字节计入事务计数；tx_bytes 必须等于实际拷贝字节，少计会提前放行。
    types:
    - debug
    - conceptual
    difficulty:
    - 3
    - 4
    kind: mechanism
  - id: cuda_ptx_cp_async_bulk
    claim: cuda::ptx::cp_async_bulk 是 sm_90 的 bulk 拷贝包装，不能在 sm_80 上当作 cp.async.ca 的别名调用。
    types:
    - syntax
    - compare
    difficulty:
    - 3
    - 4
    kind: feature
  - id: cuda_ptx_fence_proxy
    claim: cuda::ptx::fence_proxy_async() 发出 fence.proxy.async，使 generic 空间写入对 async proxy/TMA 可见；普通 __threadfence_block
      不够。
    types:
    - debug
    - conceptual
    difficulty:
    - 3
    - 4
    kind: mechanism
  - id: cuda_ptx_elect_sync
    claim: cuda::ptx::elect_sync(membermask) 在 mask 内选出恰好 1 个线程返回 true，供单线程提交 TMA；mask 外线程不得当选。
    types:
    - syntax
    - conceptual
    difficulty:
    - 3
    kind: api
  - id: cuda_ptx_tensormap
    claim: sm_90 的 cuda::ptx::tensormap_replace_global_address 运行时改 TMA descriptor 的 gmem 基址，之后需要 tensormap
      的 cp_fenceproxy 才对 TMA 引擎可见。
    types:
    - syntax
    - debug
    difficulty:
    - 4
    kind: feature
  - id: cuda_ptx_tcgen05
    claim: sm_100 的 cuda::ptx::tcgen05_* 分配/提交 TMEM MMA；在 Arch=sm_90 的编译路径上这些符号不可用。
    types:
    - syntax
    - compare
    difficulty:
    - 4
    kind: feature
  - id: cuda_ptx_n32
    claim: cuda::ptx::n32_t<Imm> 把立即数编码进指令；用运行时 int 变量冒充 n32_t 无法形成立即数修饰符。
    types:
    - syntax
    - debug
    difficulty:
    - 3
    kind: api
  - id: cuda_ptx_mbarrier_parity
    claim: mbarrier try_wait 的 parity ∈ {0,1}，每完成一轮 arrive 翻转；cuda::ptx 包装仍要求调用方维护 phase，用错 parity 会误通过或死等。
    types:
    - debug
    - conceptual
    difficulty:
    - 4
    kind: formula
  target_leaves: 10
- id: nv_target
  name: nv/target
  leaves:
  - id: nv_target_if
