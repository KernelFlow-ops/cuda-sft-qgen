id: T31
name: 融合算子实现要点
children:
- id: bias_act_fusion
  name: Bias+activation 融合
  leaves:
  - id: bias_act_epilogue
    claim: bias+act 应在 GEMM 累加器仍在寄存器时做；先写 gmem 再开 epilogue kernel 会多一轮 DRAM。
    types:
    - optimization
    - conceptual
    difficulty:
    - 2
    - 3
    kind: mechanism

- id: embedding_gather
  name: Embedding gather
  leaves:
  - id: embed_gather
    claim: embedding gather 是不规则 gmem 读；NCU 上 sector 超额高是预期，用向量化连续读的模型会误判。
    types:
    - profiling
    - conceptual
    difficulty:
    - 2
    - 3
    kind: mechanism

- id: layernorm_rms
  name: LayerNorm / RMSNorm
  leaves:
  - id: layernorm_rms_welford
    claim: RMSNorm 不减均值，只算 rsqrt(mean(x^2)+eps)；把 LayerNorm 的减均值套到 RMS 会改变数值。
    types:
    - conceptual
    - code_complete
    difficulty:
    - 2
    - 3
    kind: formula
  - id: layernorm_rms_smem
    claim: 行归约可 warp shuffle，不必把整行进 smem；hidden=4096 时整行 FP16 已 8KB，再双缓冲会挤占用。
    types:
    - optimization
    - layout
    difficulty:
    - 3
    kind: numeric

- id: quantize_elem
  name: 量化
  leaves:
  - id: quantize_scale
    claim: per-tensor scale 必须在量化前广播到元素；漏 scale 直接 round 到 int8 会饱和。
    types:
    - numeric
    - debug
    difficulty:
    - 2
    - 3
    kind: formula

- id: rope
  name: RoPE
  leaves:
  - id: rope_pair
    claim: RoPE 以 2D 对 (x0,x1) 旋转；按下标把偶奇当独立通道乘 cos/sin 会转错平面。
    types:
    - layout
    - debug
    difficulty:
    - 3
    kind: failure
  - id: rope_cache
    claim: 推理 RoPE 的 θ 依赖绝对位置；用相对 tile 内下标当全局 pos 会让 KV cache 后续 token 相位错。
    types:
    - debug
    - conceptual
    difficulty:
    - 3
    - 4
    kind: failure

- id: silu_gelu_glu
  name: SiLU / GELU / GLU
  leaves:
  - id: silu_glu_pair
    claim: SwiGLU 是 silu(gate)*up；把 silu 打在 up 上或漏乘 gate 会改变 MLP 宽度语义。
    types:
    - debug
    - conceptual
    difficulty:
    - 2
    - 3
    kind: failure
  - id: silu_vec
    claim: 逐元素 SiLU 应向量化 load；stride 不等于 1 的中间张量会让 float4 路径变成多 sector。
    types:
    - optimization
    - layout
    difficulty:
    - 2
    - 3
    kind: mechanism

- id: softmax_epilogue
  name: Softmax epilogue
  leaves:
  - id: softmax_epilogue_max
    claim: softmax 必须先 warp/block max 再 exp；先 exp 再 max 在 FP16 上更易溢出。
    types:
    - debug
    - conceptual
    difficulty:
    - 2
    - 3
    kind: failure
  - id: softmax_epilogue_l1tex
    claim: 独立 softmax kernel 在 NCU 上常 l1tex SOL 高、tensor 低；融进 GEMM epilogue 后应看到 tensor SOL 上升。
    types:
    - profiling
    - optimization
    difficulty:
    - 3
    kind: mechanism

- id: transpose_permute
  name: Transpose / permute
  leaves:
  - id: transpose_smem
    claim: smem 转置要用 bank-swizzle 或 padding；朴素 s[ty][tx]=s[tx][ty] 在 32 列上 32-way 冲突。
    types:
    - layout
    - optimization
    difficulty:
    - 3
    kind: failure

