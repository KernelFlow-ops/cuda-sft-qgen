id: T04
name: 同步与并发
children:
- id: barriers
  name: 块内与 warp 同步
  leaves:
  - id: syncthreads
    claim: __syncthreads 必须被块内所有线程到达，条件分支中调用会导致死锁
    types:
    - debug
    - conceptual
    difficulty:
    - 1
    - 2
    hints:
    - threadIdx.x < 64 时才 __syncthreads
    - if (tid==0) __syncthreads
    - 循环内部分线程提前 return 再 sync
    kind: failure
  - id: syncwarp
    claim: __syncwarp(mask) 与 __syncthreads 的范围差异，以及 mask 不等于 full 时的陷阱
    types:
    - debug
    - compare
    difficulty:
    - 2
    - 3
    kind: failure
  - id: barriers_named_sm90
    claim: sm_90 named barrier 的 arrive/wait 以 CTA 为范围，id 须在 0..15；producer-consumer 角色数必须与 arrive 计数匹配否则死锁
    types:
    - syntax
    - debug
    difficulty:
    - 3
    - 4
    kind: feature
  - id: barriers_syncthreads_count
    claim: __syncthreads_count(pred) 仍要求所有线程到达；pred 只影响返回的计数，不能用来让部分线程跳过 barrier
    types:
    - debug
    - syntax
    difficulty:
    - 2
    - 3
    kind: failure
  - id: barriers_syncthreads_or
    claim: __syncthreads_and/or 同样是全 CTA barrier，返回的是 pred 的 AND/OR；tid<32 才调用仍会死锁
    types:
    - debug
    - syntax
    difficulty:
    - 2
    kind: failure
  - id: barriers_loop_exit
    claim: 循环内部分线程 break 后其余线程 __syncthreads 会死锁；必须先把参与集对齐再同步
    types:
    - debug
    - code_complete
    difficulty:
    - 2
    - 3
    kind: failure
  - id: barriers_syncwarp_full
    claim: __syncwarp() 默认 mask=0xffffffff；Volta+ 上它不会把未执行到该点的 lane 拉来，那些 lane 必须也执行到
    types:
    - debug
    - conceptual
    difficulty:
    - 2
    - 3
    kind: mechanism
  - id: barriers_memory_vis
    claim: __syncthreads 同时做 CTA 级内存栅栏，shared/global 在 barrier 前的写对之后的读可见；__syncwarp 只保证 mask 内
    types:
    - conceptual
    - compare
    difficulty:
    - 2
    kind: mechanism
  - id: barriers_cta_not_grid
    claim: __syncthreads 不能同步不同 CTA；跨块等待必须 cooperative grid.sync、atomic 计数或 host 侧多次 launch
    types:
    - conceptual
    - debug
    difficulty:
    - 1
    - 2
    kind: failure
- id: atomics
  name: 原子与内存序
  leaves:
  - id: atomicadd_conflict
    claim: 同一地址 atomicAdd 的串行化与 shared vs global 原子吞吐差异
    types:
    - optimization
    - conceptual
    difficulty:
    - 2
    kind: mechanism
  - id: system_scope
    claim: cuda::atomic 的 thread/block/device/system scope 选错导致的可见性 bug
    types:
    - debug
    - syntax
    difficulty:
    - 3
    kind: failure
  - id: atomics_system_scope_p2p
    claim: 跨 GPU 可见的 atomic 必须是 cuda::thread_scope_system 且 peer mapping 已启用；device scope 的 atomic 对 peer
      不构成 release
    types:
    - debug
    - conceptual
    difficulty:
    - 3
    - 4
    kind: mechanism
  - id: atomics_shared_throughput
    claim: 同一 smem bank 上的 atomicAdd 串行化；把地址打散到 32 bank 后吞吐近似线性，不是无限扩展
    types:
    - optimization
    difficulty:
    - 2
    - 3
    kind: formula
  - id: atomics_cas_loop
    claim: atomicCAS 循环必须用返回的旧值再试；丢掉返回值只写一次 CAS 在竞争下会丢失更新
    types:
    - debug
    - code_complete
    difficulty:
    - 2
    - 3
    kind: failure
  - id: atomics_global_throughput
    claim: 全 warp 打同一 global 地址的 atomicAdd 串成最多 32 次往返；先 warp 归约再 1 次 atomic 把次数降到 1
    types:
    - optimization
    difficulty:
    - 2
    kind: formula
  - id: atomics_float
    claim: atomicAdd(float*) 在 sm_60+ 的 global 可用；更老 arch 的 float atomic 要 CAS 循环，不是编译器自动降级静默正确
    types:
    - syntax
    - conceptual
    difficulty:
    - 2
    kind: feature
  - id: atomics_device_scope
    claim: cuda::atomic<int, thread_scope_device> 对同 GPU 其他 CTA 可见，对 host 或 peer GPU 无 synchronizes-with
    types:
    - conceptual
    - compare
    difficulty:
    - 3
    kind: mechanism
  - id: atomics_alignment
    claim: 原子地址必须自然对齐（4B atomic 对齐 4B）；对 packed 结构里偏移 +1 的 int 做 atomicAdd 是非法访问
    types:
    - debug
    - layout
    difficulty:
    - 2
    - 3
    kind: failure
- id: async_copy
  name: 异步拷贝
  leaves:
  - id: cp_async
    claim: cp.async + commit/wait 组与 pipeline 深度选择，以及未 wait 就读的数据竞争
    types:
    - optimization
    - debug
    - code_complete
    difficulty:
    - 3
    kind: failure
  - id: async_copy_commit_group
    claim: cp.async.commit_group 把当前批次封成一组；wait_group N 等待直到未完成组数 ≤ N，wait_group 0 才保证全部可见
    types:
    - syntax
    - code_complete
    difficulty:
    - 3
    kind: api
  - id: async_copy_shared_align
    claim: cp.async 16B 传输要求 smem 地址 16B 对齐，否则静默错或硬件 fault，不是自动拆成 4B
    types:
    - debug
    - layout
    difficulty:
    - 3
    kind: failure
  - id: async_copy_sm80
    claim: cp.async 从 sm_80 起可用；sm_70 上没有该指令，编译 sm_70 目标不能靠运行时回退成同步拷贝
    types:
    - conceptual
    - syntax
    difficulty:
    - 3
    kind: feature
  - id: async_copy_size
    claim: cp.async 支持 4/8/16B 粒度；16B 路径带宽最高，但 src/dst 都要对齐 16B
    types:
    - optimization
    - layout
    difficulty:
    - 3
    kind: numeric
  - id: async_copy_zfill
    claim: cp.async 带 predicate/zfill 时越界 lane 可填 0；未使用 zfill 的越界 src 是非法读
    types:
    - debug
    - syntax
    difficulty:
    - 3
    kind: api
  - id: async_copy_wait_group_n
    claim: wait_group 1 允许 1 组 in-flight，用于双缓冲；误写成 wait_group 0 会丢掉重叠，写成不 wait 会读脏 smem
    types:
    - optimization
    - debug
    difficulty:
    - 3
    kind: numeric
  - id: async_copy_l2_hint
    claim: cp.async 的 cache hint 影响 L2 分配，不把数据送到寄存器；读结果必须从 smem 且在 wait 之后
    types:
    - conceptual
    - optimization
    difficulty:
    - 3
    kind: mechanism
  - id: async_copy_bulk
    claim: sm_90 cp.async.bulk / TMA 走不同完成协议（mbarrier expect_tx），不能用 Ampere 的 wait_group 等 TMA 完成
    types:
    - compare
    - syntax
    difficulty:
    - 3
    - 4
    kind: feature
- id: memory_order
  name: CUDA 内存序
  leaves:
  - id: memory_order_relaxed_vis
    claim: cuda::memory_order_relaxed 的 atomic 不提供跨线程同步；只保证该地址的原子性，不能当 lock 的 unlock
    types:
    - debug
    - conceptual
    difficulty:
    - 3
    kind: mechanism
  - id: memory_order_acquire_release
    claim: producer release store 与 consumer acquire load 配对才建立 happens-before；两边都 relaxed 则可见性无保证
    types:
    - debug
    - conceptual
    difficulty:
    - 3
    kind: mechanism
  - id: memory_order_volatile_not
    claim: volatile 只阻止编译器合并该地址访问，不提供原子性也不提供跨线程 fence
    types:
    - compare
    - debug
    difficulty:
    - 2
    - 3
    kind: failure
  - id: memory_order_threadfence
    claim: __threadfence() 是 device 级 fence，不是 system；对 pinned host 可见性要用 __threadfence_system 或 system-scope
      atomic
    types:
    - syntax
    - debug
    difficulty:
    - 3
    kind: api
  - id: memory_order_threadfence_block
    claim: __threadfence_block() 只保证本 CTA 内对 global/shared 的顺序，其他 CTA 仍可能看不到 store
    types:
    - conceptual
    - compare
    difficulty:
    - 2
    - 3
    kind: api
  - id: memory_order_seq_cst
    claim: cuda::memory_order_seq_cst 更强但更贵；在 GPU 上常用 acq_rel 配对，seq_cst 不会自动变成 CTA barrier
    types:
    - conceptual
    - optimization
    difficulty:
    - 3
    kind: mechanism
  - id: memory_order_atomic_thread_fence
    claim: cuda::atomic_thread_fence(acq_rel, thread_scope_device) 对应 PTX fence.acq_rel.gpu，不汇合控制流
    types:
    - syntax
    - conceptual
    difficulty:
    - 3
    kind: api
  - id: memory_order_data_race
    claim: 两线程对同一非原子地址并发写写或写读且无 happens-before 是 CUDA 数据竞争，volatile 不能修复
    types:
    - debug
    - conceptual
    difficulty:
    - 2
    - 3
    kind: failure
  - id: memory_order_consume
    claim: CUDA/libcu++ 不提供可用的 memory_order_consume 优化路径；依赖消费序应写成 acquire
    types:
    - syntax
    - conceptual
    difficulty:
    - 3
    - 4
    kind: api
- id: mbarrier
  name: mbarrier 协议
  leaves:
  - id: mbarrier_expect_tx
    claim: sm_90 mbarrier.arrive.expect_tx 把预期事务字节数打进 barrier；TMA 完成的 tx 计数对不上会永远 wait
    types:
    - syntax
    - debug
    difficulty:
    - 3
    - 4
    kind: feature
  - id: mbarrier_phase
    claim: mbarrier 有 phase 翻转；wait 必须带正确 phase，复用同一对象跨轮次时用错 phase 会立刻通过或死等
    types:
    - debug
    - code_complete
    difficulty:
    - 4
    kind: failure
  - id: mbarrier_cta_scope
    claim: smem 里的 mbarrier 默认 CTA 范围，不能拿来同步 cluster 内另一个 CTA，除非用 cluster mbarrier 语义
    types:
    - conceptual
    - debug
    difficulty:
    - 3
    - 4
    kind: mechanism
  - id: mbarrier_init
    claim: mbarrier.init 必须在使用前由线程执行；未初始化的 arrive/wait 是 UB
    types:
    - syntax
    - debug
    difficulty:
    - 3
    kind: api
  - id: mbarrier_arrive_count
    claim: expected_arrives = 将调用 arrive 的线程（或角色）数；多 arrive 会提前放行，少 arrive 死等
    types:
    - debug
    - conceptual
    difficulty:
    - 3
    - 4
    kind: formula
  - id: mbarrier_try_wait
    claim: try_wait 带 phase 与可选 hint，失败应循环而不是当已完成；把它当非阻塞“读数据许可”会读到未完成 TMA
    types:
    - syntax
    - debug
    difficulty:
    - 4
    kind: api
  - id: mbarrier_tx_bytes
    claim: expect_tx 的字节数必须等于实际 TMA/cp.async.bulk 完成上报的 tx；16KB tile 写成 1024 会永远等
    types:
    - debug
    - conceptual
    difficulty:
    - 3
    - 4
    kind: numeric
  - id: mbarrier_sm90
    claim: 硬件 mbarrier 完成异步拷贝从 sm_90 起与 TMA 深度集成；在 sm_80 上没有等价的 expect_tx TMA 路径
    types:
    - conceptual
    - compare
    difficulty:
    - 3
    kind: feature
  - id: mbarrier_parity
    claim: wait 使用的 parity/phase 必须与当前轮一致；翻转后用旧 token wait 会立即返回，消费者读到下一轮未写完的缓冲
    types:
    - debug
    - counterfactual
    difficulty:
    - 4
    kind: failure
- id: cuda_pipeline
  name: cuda::pipeline
  leaves:
  - id: cuda_pipeline_producer_role
    claim: cuda::pipeline 的 producer_acquire/commit 与 consumer_wait/release 必须成对，跨阶段漏 release 会卡住后续轮
    types:
    - syntax
    - code_complete
    difficulty:
    - 3
    kind: api
  - id: cuda_pipeline_async_memcpy
    claim: cuda::memcpy_async 经 pipeline 提交，未 consumer_wait 就读 dst 是数据竞争
    types:
    - debug
    - optimization
    difficulty:
    - 3
    kind: failure
  - id: cuda_pipeline_stages
    claim: pipeline stages=2 只允许 2 个 in-flight 组；stage 数必须与 smem 缓冲块数一致
    types:
    - optimization
    difficulty:
    - 3
    kind: numeric
  - id: cuda_pipeline_thread_scope
    claim: pipeline 对象的 thread_scope 决定谁可以 commit/wait；用 thread 范围对象跨 warp 操作非法
    types:
    - debug
    - syntax
    difficulty:
    - 3
    kind: api
  - id: cuda_pipeline_shared_state
    claim: block-scope pipeline 状态在 smem，必须在使用前初始化；未 make_pipeline 就 memcpy_async 是 UB
    types:
    - syntax
    - debug
    difficulty:
    - 3
    kind: api
  - id: cuda_pipeline_ampere
    claim: cuda::memcpy_async + pipeline 在 sm_80 上可降到 cp.async；在 sm_70 上可能同步拷贝，重叠消失
    types:
    - conceptual
    - compare
    difficulty:
    - 3
    kind: feature
  - id: cuda_pipeline_acquire
    claim: producer_acquire 等待一个空 stage；所有 producer 线程都要调用，只让 thread 0 acquire 会破坏流水线计数
    types:
    - debug
    - code_complete
    difficulty:
    - 3
    kind: failure
  - id: cuda_pipeline_consumer_wait
    claim: consumer_wait 返回前 dst smem 对 consumer 可见；wait 之后仍要 CTA/warp 同步才能让未参与 memcpy 的线程读同一缓冲
    types:
    - conceptual
    - debug
    difficulty:
    - 3
    kind: mechanism
- id: named_barrier
  name: Named barrier 与 arrive-wait
  leaves:
  - id: named_barrier_id_range
    claim: Hopper 硬件 named barrier id 范围 0..15，共 16 个；id=16 非法。CUTLASS 文档建议避开 id 0 以免与 __syncthreads 冲突
    types:
    - syntax
    - debug
    difficulty:
    - 3
    kind: feature
  - id: named_barrier_count
    claim: bar.sync id, count 的 count 必须等于参与线程数且为 warp 大小的倍数；count=33 或漏掉一个 warp 会死锁
    types:
    - debug
    - syntax
    difficulty:
    - 3
    - 4
    kind: formula
  - id: named_barrier_arrive_wait
    claim: 拆成 arrive 与 wait 后，producer 可在 wait 前做无关工作；arrive 次数仍必须凑满 init/count
    types:
    - conceptual
    - code_complete
    difficulty:
    - 3
    kind: mechanism
  - id: named_barrier_subset
    claim: named barrier 可只同步 CTA 的一个 warp 子集（如 128 个线程），其余线程不参与；混入 __syncthreads 会把未参与 warp 拉死
    types:
    - debug
    - compare
    difficulty:
    - 3
    - 4
    kind: failure
  - id: named_barrier_sm90
    claim: 用户可编程 named barrier 作为独立硬件资源从 Hopper sm_90 起强调；在 sm_80 上等价模式受限于异步 barrier 对象
    types:
    - conceptual
    difficulty:
    - 3
    kind: feature
  - id: named_barrier_reuse
    claim: 同一 id 在下一阶段复用前必须完成本阶段 wait；重叠两个协议在同一 id 上会串台
    types:
    - debug
    - conceptual
    difficulty:
    - 4
    kind: failure
  - id: named_barrier_cluster
    claim: CTA named barrier 不能同步 cluster 内远端 CTA；跨 CTA 要用 cluster.sync 或 cluster-scope mbarrier
    types:
    - conceptual
    - compare
    difficulty:
    - 3
    - 4
    kind: mechanism
  - id: named_barrier_ptx
    claim: PTX bar.sync / bar.arrive 的第一个操作数是 barrier id，第二个是参与线程数；写反会把 id 当成 count
    types:
    - syntax
    - debug
    difficulty:
    - 3
    kind: api
- id: cluster_sync
  name: Cluster 同步
  leaves:
  - id: cluster_sync_this_cluster
    claim: this_cluster().sync() 同步 cluster 内全部 CTA，仅 sm_90+ cluster launch 合法；普通 launch 里调用没有 cluster 栅栏
    types:
    - syntax
    - debug
    difficulty:
    - 3
    kind: feature
  - id: cluster_sync_dsmem_order
    claim: 写远端 dsmem 后必须 cluster.sync（或等价 cluster barrier）再让对端读，否则数据竞争
    types:
    - debug
    - conceptual
    difficulty:
    - 3
    - 4
    kind: failure
  - id: cluster_sync_not_grid
    claim: cluster.sync 范围小于 grid.sync；不同 cluster 的 CTA 互不可见，不能用它替代 cooperative grid barrier
    types:
    - compare
    - conceptual
    difficulty:
    - 3
    kind: mechanism
  - id: cluster_sync_size
    claim: cluster 内 CTA 数由 launch clusterDim 决定，常用 2 或 8；sync 等待的就是这些 CTA，不是整个 grid
    types:
    - conceptual
    difficulty:
    - 3
    kind: numeric
  - id: cluster_sync_mbarrier
    claim: cluster-scope mbarrier 允许远端 arrive、本地 wait；在远端 smem 上 wait 不合法
    types:
    - syntax
    - debug
    difficulty:
    - 4
    kind: api
  - id: cluster_sync_mapped
    claim: 远端 smem 映射进本 CTA 地址空间后，普通 ld/st 仍无隐式 cluster 栅栏，可见性要显式 sync
    types:
    - conceptual
    difficulty:
    - 3
    - 4
    kind: mechanism
  - id: cluster_sync_deadlock
    claim: cluster 内一个 CTA 走条件路径跳过 cluster.sync，其余 CTA 永久等待；与 __syncthreads 漏线程同构
    types:
    - debug
    - counterfactual
    difficulty:
    - 3
    - 4
    kind: failure
  - id: cluster_sync_launch_api
    claim: 未在 cudaLaunchKernelEx 设置 ClusterDimension 时，硬件不组成 cluster，this_cluster() 行为不是“大小为 1 的合法 cluster sync”
    types:
    - debug
    - syntax
    difficulty:
    - 3
    kind: failure
- id: fence_ptx
  name: PTX fence 与代理
  leaves:
  - id: fence_ptx_sc_gpu
    claim: fence.sc.gpu 是 GPU 范围 sequentially consistent fence，比 membar.gl 更明确；它不汇合 CTA 线程
    types:
    - syntax
    - conceptual
    difficulty:
    - 3
    kind: api
  - id: fence_ptx_acq_rel_cta
    claim: fence.acq_rel.cta 对应 block 范围，对其他 CTA 的 global 写无保证；跨 CTA 要用 .gpu 或 atomic release
    types:
    - conceptual
    - compare
    difficulty:
    - 3
    kind: mechanism
  - id: fence_ptx_sys
    claim: fence.sc.sys / __threadfence_system 才对 host 与 peer 提供系统范围顺序；.gpu fence 不够
    types:
    - debug
    - conceptual
    difficulty:
    - 3
    kind: api
  - id: fence_ptx_proxy_async
    claim: sm_90 fence.proxy.async 让 TMA/async 代理的写对后续可见；只 __syncthreads 不等价于 proxy fence
    types:
    - debug
    - conceptual
    difficulty:
    - 4
    kind: feature
  - id: fence_ptx_membar_gl
    claim: membar.gl 是较老的 device 级 membar；新代码应优先 fence.* ，二者不能与 __syncthreads 混为可互换
    types:
    - compare
    - syntax
    difficulty:
    - 3
    kind: api
  - id: fence_ptx_alias
    claim: fence 不建立控制流汇合；两个 warp 都 fence 后仍可能一个还没执行到 store，需要 barrier 或 atomic 同步
    types:
    - conceptual
    - debug
    difficulty:
    - 3
    kind: mechanism
  - id: fence_ptx_ldst
    claim: ld.acquire / st.release 把序嵌在访存上，比单独 fence+relaxed 更窄；地址必须是原子/适当对齐路径
    types:
    - syntax
    - optimization
    difficulty:
    - 3
    - 4
    kind: api
  - id: fence_ptx_view
    claim: 不同 virtual address 别名同一物理页时，fence 按 CUDA 内存模型对对象生效，不是按物理地址自动合并
    types:
    - conceptual
    difficulty:
    - 4
    kind: mechanism
- id: cg_barrier
  name: Cooperative Groups 同步
  leaves:
  - id: cg_barrier_thread_block
    claim: this_thread_block().sync() 等价 __syncthreads，要求 CTA 全员到达，不能只同步一个 tile
    types:
    - syntax
    - compare
    difficulty:
    - 2
    kind: api
  - id: cg_barrier_tile
    claim: thread_block_tile<16>.sync() 只同步该 16 线程组；组外 lane 不参与，用它替代 __syncwarp(full) 会漏 16 lane
    types:
    - debug
    - conceptual
    difficulty:
    - 2
    - 3
    kind: failure
  - id: cg_barrier_grid
    claim: this_grid().sync() 要求 cooperative launch 且所有 CTA 存活到该点；有 CTA 提前 return 则死锁
    types:
    - debug
    - conceptual
    difficulty:
    - 2
    - 3
    kind: failure
  - id: cg_barrier_coalesced
    claim: coalesced_group.sync() 只同步当前汇合的活动 lane，不会拉回另一分支
    types:
    - conceptual
    - debug
    difficulty:
    - 3
    kind: mechanism
  - id: cg_barrier_memcpy_wait
    claim: cg::wait(group) 等待先前 memcpy_async；group 成员必须一致 wait，否则完成信号与读数据的线程集不匹配
    types:
    - debug
    - code_complete
    difficulty:
    - 3
    kind: failure
  - id: cg_barrier_named
    claim: sm_90+ CG 可封装 named barrier；参与计数仍要与 tile 大小一致，CG 不会自动填补未加入的 warp
    types:
    - syntax
    - conceptual
    difficulty:
    - 3
    - 4
    kind: feature
  - id: cg_barrier_multi_grid
    claim: this_multi_grid().sync() 需要 cudaLaunchCooperativeKernelMultiDevice，单卡 cooperative launch 不够
    types:
    - syntax
    - conceptual
    difficulty:
    - 3
    - 4
    kind: api
  - id: cg_barrier_partition
    claim: tiled_partition 得到的子 group 的 sync 范围是子组；父 group 与子 group 交叉 sync 会造成参与集不一致
    types:
    - debug
    - conceptual
    difficulty:
    - 3
    kind: failure
- id: atomic_ops
  name: 原子操作变体
  leaves:
  - id: atomic_ops_add_sub
    claim: atomicAdd/atomicSub 返回旧值；用返回值+1 当新值再写回非原子存储会丢掉并发更新
    types:
    - debug
    - syntax
    difficulty:
    - 2
    kind: failure
  - id: atomic_ops_exch
    claim: atomicExch 无条件换值，不比较；要用它做 lock 必须约定 0/1，并在解锁路径用 store-release 或 atomicExch 回 0
    types:
    - code_complete
    - conceptual
    difficulty:
    - 2
    - 3
    kind: api
  - id: atomic_ops_cas_64
    claim: atomicCAS 对 64-bit 需要 unsigned long long 地址 8B 对齐；对 int64 未对齐拆成两次 32-bit CAS 不是原子
    types:
    - debug
    - layout
    difficulty:
    - 3
    kind: failure
  - id: atomic_ops_minmax
    claim: atomicMin/Max 对有符号/无符号重载不同；对有符号负数用 unsigned 解释会得到错误极值
    types:
    - debug
    - syntax
    difficulty:
    - 2
    kind: api
  - id: atomic_ops_inc_dec
    claim: atomicInc(addr, val) 在旧值>=val 时回绕到 0，不是简单 +1；当计数器用会在 val 处清零
    types:
    - conceptual
    - debug
    difficulty:
    - 2
    - 3
    kind: api
  - id: atomic_ops_shared
    claim: smem 原子在 Ampere+ 吞吐高但仍按 bank 串行；32 线程打 32 个不同 bank 才能接近峰值
    types:
    - optimization
    difficulty:
    - 2
    - 3
    kind: formula
  - id: atomic_ops_system
    claim: atomicAdd_system 是 system-scope 的 C 风格原子；与 host 交互仍要保证 host 侧也用原子/fence，不能只靠 GPU 原子
    types:
    - conceptual
    - debug
    difficulty:
    - 3
    kind: api
  - id: atomic_ops_red
    claim: PTX red 指令做归约写不返回旧值，比 atom.add 更轻；需要旧值时必须用 atom 而不是 red
    types:
    - optimization
    - compare
    difficulty:
    - 3
    kind: api
- id: semaphore_lib
  name: cuda::barrier 与信号量
  leaves:
  - id: semaphore_lib_barrier_init
    claim: cuda::barrier 必须 barrier_init / init 指定 expected 到达数；默认构造未 init 就 arrive 是 UB
    types:
    - syntax
    - debug
    difficulty:
    - 3
    kind: api
  - id: semaphore_lib_token
    claim: arrive() 返回 token，wait(move(token)) 必须用同一次 arrive 的 token；跨阶段复用旧 token 会立刻通过或死等
    types:
    - debug
    - code_complete
    difficulty:
    - 3
    - 4
    kind: failure
  - id: semaphore_lib_scope
    claim: cuda::barrier<thread_scope_block> 放 smem，device-scope barrier 放 global；作用域与存放空间不匹配则同步无效
    types:
    - layout
    - debug
    difficulty:
    - 3
    kind: api
  - id: semaphore_lib_binary_sem
    claim: cuda::binary_semaphore / counting_semaphore 的 acquire/release 按 C++ 语义，但 GPU 上 busy-wait 会占着 warp
    types:
    - optimization
    - conceptual
    difficulty:
    - 3
    kind: mechanism
  - id: semaphore_lib_latch
    claim: cuda::latch 一次性倒计数，不能当可重用 barrier；第二轮 arrive 不会再打开
    types:
    - conceptual
    - debug
    difficulty:
    - 3
    kind: api
  - id: semaphore_lib_expected
    claim: expected 到达数 = 参与 arrive 的线程数；warp 特化时 expected=128 而只有 4 个 warp arrive 会永远 wait
    types:
    - debug
    difficulty:
    - 3
    kind: formula
  - id: semaphore_lib_sm80
    claim: sm_80+ 的 block-scope cuda::barrier 可硬件加速异步拷贝完成；sm_70 上同一 API 可能走软件路径
    types:
    - conceptual
    - compare
    difficulty:
    - 3
    kind: feature
  - id: semaphore_lib_arrive_tx
    claim: sm_90 cuda::device::barrier_arrive_tx 把 TMA 字节计入 barrier，与 mbarrier.expect_tx 同类；漏计 tx 导致死等
    types:
    - syntax
    - debug
    difficulty:
    - 4
    kind: feature
- id: red_instr
  name: 归约写与原子吞吐
  leaves:
  - id: red_instr_vs_atom
    claim: 不需要旧值时 PTX red.add 比 atom.add 更便宜；两者都串行化同一地址，red 不返回数据
    types:
    - optimization
    - compare
    difficulty:
    - 3
    kind: api
  - id: red_instr_shared
    claim: red.shared.f32 仍受 bank 冲突约束；32 线程 red 同一 smem 字串成 32-way
    types:
    - optimization
    difficulty:
    - 2
    - 3
    kind: formula
  - id: red_instr_global
    claim: 全局 red 适合直方图桶；热点桶应先 warp 内归约再 1 次 red，把 32 次全局 red 变成 1 次
    types:
    - optimization
    - code_complete
    difficulty:
    - 2
    kind: formula
  - id: red_instr_order
    claim: red 默认 relaxed 语义，不带 release；用 red 发布指针后消费者 acquire-load 不构成完整发布协议
    types:
    - debug
    - conceptual
    difficulty:
    - 3
    - 4
    kind: failure
  - id: red_instr_types
    claim: red 支持的类型随 ISA 变化；sm_60 才有 global f32 add 原子/归约，更早 arch 编译该指令失败
    types:
    - syntax
    - conceptual
    difficulty:
    - 2
    - 3
    kind: feature
  - id: red_instr_vector
    claim: 没有 128-bit 一条红的通用 red.v4；float4 要拆标量 red，对齐向量原子不是默认能力
    types:
    - syntax
    - conceptual
    difficulty:
    - 3
    kind: api
  - id: red_instr_conflict
    claim: NCU atomic throughput 计数把 red 与 atom 都算进原子管道；高计数说明地址争用，不是“原子很快”
    types:
    - profiling
    - conceptual
    difficulty:
    - 2
    - 3
    kind: mechanism
  - id: red_instr_cas_fallback
    claim: 对不支持的类型手写 CAS 循环，正确性依赖比较的是整位模式；NaN float CAS 可能永远不相等
    types:
    - debug
    - conceptual
    difficulty:
    - 3
    kind: failure
