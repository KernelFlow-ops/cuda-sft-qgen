- id: kahan_comp
  name: 补偿求和
  leaves:
  - id: kahan_comp_alg
    claim: Kahan：y=x-c; t=sum+y; c=(t-sum)-y; sum=t。漏更新 c 就退化成普通累加
    types:
    - code_complete
    - conceptual
    difficulty:
    - 2
    - 3
    kind: formula
  - id: kahan_comp_fma
    claim: 编译器把 Kahan 表达式收成 FMA 或再结合会消掉补偿项；需 volatile 或 -fmad=false 保护
    types:
    - debug
    - syntax
    difficulty:
    - 3
    kind: failure
  - id: kahan_comp_block
    claim: 块内 Kahan 再跨块普通加，全局仍是分块误差；要全局补偿需把 c 也一起归约
    types:
    - optimization
    - conceptual
    difficulty:
    - 3
    kind: mechanism
  - id: kahan_comp_vs_tree
    claim: 树归约误差 O(log n ulp)，Kahan 线性链近 O(1 ulp)；n=1e8 时两者都优于朴素链但常数不同
    types:
    - compare
    - optimization
    difficulty:
    - 3
    kind: formula
  - id: kahan_comp_fp16
    claim: 在 FP16 上跑 Kahan 意义有限，补偿项本身会下溢；应升 FP32 再补偿
    types:
    - optimization
    - debug
    difficulty:
    - 3
    kind: numeric
  - id: kahan_comp_atomic
    claim: 对全局 sum 做原子 Kahan 不可行，因为 c 与 sum 要原子配对；并发写会拆开补偿
    types:
    - debug
    - conceptual
    difficulty:
    - 3
    kind: failure
  - id: kahan_comp_neumaier
    claim: Neumaier 改进在 |x| 大于 |sum| 时更稳；普通 Kahan 在这种量级翻转下补偿不足
    types:
    - compare
    - conceptual
    difficulty:
    - 3
    kind: numeric
  - id: kahan_comp_tc
    claim: Tensor Core 部分和不能用标量 Kahan 插入 MMA 内部；只能在 tile 边界对 FP32 acc 做补偿
    types:
    - optimization
    - conceptual
    difficulty:
    - 3
    - 4
    kind: mechanism
- id: tf32_mant
  name: TF32 尾数
  leaves:
  - id: tf32_mant_10bit
    claim: TF32 尾数 10 bit，FP32 是 23 bit，同指数 ulp_TF32 / ulp_FP32 = 2^(13)=8192
    types:
    - conceptual
    - compare
    difficulty:
    - 2
    - 3
    kind: formula
  - id: tf32_mant_exp
    claim: TF32 指数 8 bit 与 FP32 相同，动态范围相当；溢出行为不像 FP16 那么早
    types:
    - conceptual
    - compare
    difficulty:
    - 2
    kind: numeric
  - id: tf32_mant_round
    claim: FP32 输入进 TF32 MMA 先舍入尾数；往返再存 FP32 不能恢复丢掉的 13 bit
    types:
    - conceptual
    - debug
    difficulty:
    - 2
    - 3
    kind: mechanism
  - id: tf32_mant_cublas
    claim: CUBLAS_COMPUTE_32F_FAST_TF32 走 TF32；CUBLAS_COMPUTE_32F 保持 FP32 仿真/路径，两者数值不同
    types:
    - compare
    - syntax
    difficulty:
    - 2
    - 3
    kind: api
  - id: tf32_mant_error_bound
    claim: 一次 TF32 乘加的相对误差量级约 2^-10，不能用 2^-23 的 FP32 ulp 去写证明
    types:
    - conceptual
    - optimization
    difficulty:
    - 3
    kind: formula
  - id: tf32_mant_mixed
    claim: A/B 以 TF32 乘、acc 以 FP32 加，acc 精度高但每次注入 TF32 舍入；大 K 仍积累
    types:
    - conceptual
    - debug
    difficulty:
    - 3
    kind: numeric
  - id: tf32_mant_disable
    claim: NVIDIA_TF32_OVERRIDE=0 可关库的 TF32；只改源码 math mode 而不改环境仍可能被库打开
    types:
    - syntax
    - debug
    difficulty:
    - 2
    kind: api
  - id: tf32_mant_ptx
    claim: mma.sync 的 .tf32 变体与 .f32 输入转换不同；看 SASS 是否 HMMA/MMA TF32 才能确认
    types:
    - profiling
    - syntax
    difficulty:
    - 3
    kind: feature
- id: reduction_tree
  name: 归约树顺序
  leaves:
  - id: reduction_tree_logn
    claim: 完全二叉树深度 ceil(log2(n))；n=1024 时深度 10，线性链深度 1023，误差项数量级不同
    types:
    - conceptual
    - compare
    difficulty:
    - 2
    kind: formula
  - id: reduction_tree_shfl
    claim: xor 树顺序固定则 warp 内 bitwise 稳定；改成 butterfly 与 sequential shfl_down 可能差 1 ULP
    types:
    - compare
    - code_complete
    difficulty:
    - 2
    - 3
    kind: numeric
  - id: reduction_tree_block
    claim: block 树先 warp 再 smem；smem 阶段顺序也要固定，按 tid 原子加破坏块内确定
    types:
    - debug
    - code_complete
    difficulty:
    - 2
    - 3
