id: arch_compare
title: NVIDIA 架构对照（对算子的含义）
priority: 1
domains: [T17, T08, T30]
l2_targets:
  - {domain: T17, l2: arch_compare, target_leaves: 16}
facets: [feature, formula, failure, arch_migrate]
official_sources:
  - https://docs.nvidia.com/cuda/cuda-c-programming-guide/index.html
entities:
  - {id: arch:sm_80, kind: arch, label: Ampere sm_80}
  - {id: arch:sm_90, kind: arch, label: Hopper sm_90}
  - {id: arch:sm_100, kind: arch, label: Blackwell sm_100}
seed_claims:
  - l3_id: arch_compare_async_gen
    domain_id: T17
    l2_id: arch_compare
    l2_name: 架构对照
    claim: sm_80 异步搬移是 cp.async.ca/cg；sm_90 才有 cp.async.bulk.tensor/TMA；sm_100 累加可驻 TMEM，不能把 tensormap 当 Ampere 路径。
    types: [compare, conceptual]
    difficulty: [3]
    kind: feature
  - l3_id: arch_compare_smem_cap
    domain_id: T17
    l2_id: arch_compare
    l2_name: 架构对照
    claim: Ampere 每 SM 共享内存上限 164KB，Hopper 可到 227/228KB 量级；把 Hopper tile 的 200KB smem 预算套到 sm_80 会 launch 失败。
    types: [optimization, compare]
    difficulty: [2, 3]
    kind: numeric
  - l3_id: arch_compare_tc_gen
    domain_id: T17
    l2_id: arch_compare
    l2_name: 架构对照
    claim: Tensor Core 指令世代为 MMA(sm_80) → WGMMA(sm_90) → UMMA/tcgen05(sm_100)；在 sm_80 上发 wgmma 非法。
    types: [compare, conceptual]
    difficulty: [3]
    kind: feature
  - l3_id: arch_compare_cluster
    domain_id: T17
    l2_id: arch_compare
    l2_name: 架构对照
    claim: Thread-block cluster 与 DSMEM 从 sm_90 起；sm_80 没有 cluster 维，不能用 cluster.sync 代替 CTA __syncthreads。
    types: [compare, conceptual]
    difficulty: [3]
    kind: feature
  - l3_id: arch_compare_regfile
    domain_id: T17
    l2_id: arch_compare
    l2_name: 架构对照
    claim: SM70–SM90 寄存器堆为 65536×32-bit/SM；resident_warps = min(64, floor(65536/(regs*32)), 2048/threads, smem_limit, 32 CTA)。
    types: [optimization, conceptual]
    difficulty: [2, 3]
    kind: formula
  - l3_id: arch_compare_cuda_arch
    domain_id: T17
    l2_id: arch_compare
    l2_name: 架构对照
    claim: 运行时路径必须用 __CUDA_ARCH__ 或 cudaGetDeviceProperties.major/minor 分支；occupancy API 成功不能证明 TMA/WGMMA 在该 GPU 上存在。
    types: [debug, compare]
    difficulty: [2, 3]
    kind: failure
  - l3_id: arch_compare_tmem_not_smem
    domain_id: T17
    l2_id: arch_compare
    l2_name: 架构对照
    claim: Blackwell TMEM 不是 shared memory；把 TMEM 地址当 smem 指针解引用或对 TMEM 做 __syncthreads 可见性推理是错的。
    types: [debug, conceptual]
    difficulty: [3, 4]
    kind: failure
  - l3_id: arch_compare_cp_async_align
    domain_id: T17
    l2_id: arch_compare
    l2_name: 架构对照
    claim: sm_80 的 cp.async 16B 路径要求 gmem 与 smem 都 16B 对齐；Hopper TMA 全局基址仍要 16B，但不走 cp.async.ca 的 L1 策略。
    types: [debug, layout]
    difficulty: [3]
    kind: mechanism
relations:
  - {source: arch_compare_async_gen, target: arch_compare_tc_gen, kind: precedes, reason: async copy generation before TC ISA}
  - {source: arch_compare_smem_cap, target: arch_compare_regfile, kind: related, reason: occupancy inputs}
  - {source: arch_compare_tmem_not_smem, target: arch:sm_100, kind: applies_to, reason: blackwell tmem}
  - {source: arch_compare_async_gen, target: arch:sm_90, kind: applies_to, reason: tma from hopper}
gap_prompts:
  - Ampere vs Hopper vs Blackwell 异步拷贝与 Tensor Core 指令对照
  - 把 Hopper smem 预算套到 Ampere 的 launch 失败
  - TMEM 不是 smem
